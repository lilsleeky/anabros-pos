const CS={q:'',detail:'',preset:'all',from:'',to:'',sort:'name',rank:'qty',dp:'all',df:'',dt:''};
const spentBy=id=>r2(db.sales.filter(s=>!s.voided&&s.customerId===id).reduce((a,s)=>a+s.total,0));
function custStats(id,from,to){
  let spent=0,visits=0,items=0,last='';
  db.sales.forEach(s=>{if(s.voided||s.customerId!==id)return;const k=dkey(s.date);if(k<from||k>to)return;spent+=s.total;if(s.type==='sale')visits++;items+=s.lines.reduce((a,l)=>a+l.qty*sgn(s),0);if(s.date>last)last=s.date});
  return{spent:r2(spent),visits,items,last};
}
function vCustomers(){app.onclick=null;
  if(CS.detail&&custById(CS.detail))return customerDetail(CS.detail);
  app.innerHTML=`<div class="page-h"><h1>Customers</h1><div class="actions">${can('data')?'<button class="btn" id="imp" type="button">Import from Excel</button><button class="btn" id="exp" type="button">Export to Excel</button>':''}<button class="btn primary" id="add" type="button">Add customer</button></div></div>
  <div class="panel"><div class="filters"><input id="cq" class="grow" type="search" placeholder="Search name, phone, email or card number" value="${esc(CS.q)}">
  <label class="f" style="flex-direction:row;align-items:center;gap:6px">Rank by<select id="cs"><option value="name"${CS.sort==='name'?' selected':''}>Name</option><option value="spent"${CS.sort==='spent'?' selected':''}>Who spends the most</option><option value="visits"${CS.sort==='visits'?' selected':''}>Most visits</option></select></label>
  ${periodSelect('cp',CS.preset)}<span id="cc" class="${CS.preset==='custom'?'':'hide'}" style="display:flex;gap:8px"><input id="cf" type="date" value="${CS.from}" aria-label="From"><input id="ct" type="date" value="${CS.to}" aria-label="To"></span></div>
  <div class="scroll" id="ctbl"></div></div>`;
  $('#add').onclick=()=>customerForm(null,()=>vCustomers());$('#cq').oninput=e=>{CS.q=e.target.value;custRows()};
  $('#cs').onchange=e=>{CS.sort=e.target.value;custRows()};
  $('#cp').onchange=e=>{CS.preset=e.target.value;$('#cc').classList.toggle('hide',CS.preset!=='custom');custRows()};
  $('#cf').onchange=e=>{CS.from=e.target.value;custRows()};$('#ct').onchange=e=>{CS.to=e.target.value;custRows()};
  if(can('data')){$('#imp').onclick=()=>importModal('customers');$('#exp').onclick=()=>exportRows('customers',{Customers:custList().map(r=>({Name:r.c.name,Phone:r.c.phone,Email:r.c.email,Address:r.c.address,'Card number':r.c.cardNo,Points:r.c.points,Owes:r.c.owed,'Spent in period':r.st.spent,'Visits in period':r.st.visits,'All-time spent':spentBy(r.c.id),'Accepts promotions':r.c.optIn?'Yes':'No'}))})}
  custRows();
}
function custList(){
  const [from,to]=periodRange(CS.preset,CS.from,CS.to);const q=CS.q.trim().toLowerCase();
  let rows=db.customers.filter(c=>!q||(c.name+' '+c.phone+' '+c.email+' '+c.cardNo).toLowerCase().includes(q)).map(c=>({c,st:custStats(c.id,from,to)}));
  rows.sort((a,b)=>CS.sort==='spent'?b.st.spent-a.st.spent||a.c.name.localeCompare(b.c.name):CS.sort==='visits'?b.st.visits-a.st.visits||b.st.spent-a.st.spent:a.c.name.localeCompare(b.c.name));
  return rows;
}

}
function customerDetail(id){
  const c=custById(id);const [from,to]=periodRange(CS.dp,CS.df,CS.dt);
  const all=db.sales.filter(s=>s.customerId===id&&dkey(s.date)>=from&&dkey(s.date)<=to).sort((a,b)=>a.date<b.date?1:-1);
  const live=all.filter(s=>!s.voided);
  const spent=r2(live.reduce((a,s)=>a+s.total,0));
  const lines=[];all.forEach(s=>s.lines.forEach(l=>lines.push({s,l})));
  const byItem={};live.forEach(s=>s.lines.forEach(l=>{const o=byItem[l.itemId]||(byItem[l.itemId]={name:l.name,qty:0,amt:0,last:s.date,n:0,unit:(itemById(l.itemId)||{}).unit||'piece'});o.qty+=l.qty*sgn(s);o.amt+=l.net*sgn(s);if(s.type==='sale')o.n++;if(s.date>o.last)o.last=s.date}));
  const items=Object.values(byItem);
  const rk={qty:['Most units bought',(a,b)=>b.qty-a.qty],amt:['Most money spent',(a,b)=>b.amt-a.amt],n:['Most often bought',(a,b)=>b.n-a.n]};
  items.sort(rk[CS.rank][1]);

  app.innerHTML=`<div class="page-h"><div><button class="lnk" id="bk" type="button">&larr; All customers</button><h1>${esc(c.name)}</h1><div class="muted">${[c.phone,c.email,c.address,c.cardNo?'Card '+c.cardNo:''].filter(Boolean).map(esc).join(' · ')||'No contact details'}</div></div>
  <div class="actions">${c.owed>0?'<button class="btn primary" id="rp" type="button">Receive payment</button>':''}<button class="btn" id="ed" type="button">Edit</button>${can('data')?'<button class="btn" id="ex" type="button">Export purchases</button>':''}</div></div>
  <div class="panel"><div class="filters">${periodSelect('dpp',CS.dp)}<span id="dpc" class="${CS.dp==='custom'?'':'hide'}" style="display:flex;gap:8px"><input id="dpf" type="date" value="${CS.df}" aria-label="From"><input id="dpt" type="date" value="${CS.dt}" aria-label="To"></span><span class="muted sm">${CS.dp==='all'?'All time':from===to?from:from+' to '+to}</span></div>

  <section class="panel sec"><div class="ph"><h2>What this customer buys</h2><label class="f" style="flex-direction:row;align-items:center;gap:6px">Rank by<select id="rk"><option value="qty"${CS.rank==='qty'?' selected':''}>Most units bought</option><option value="amt"${CS.rank==='amt'?' selected':''}>Most money spent</option><option value="n"${CS.rank==='n'?' selected':''}>Most often bought</option></select></label></div>${items.length?`<div class="scroll"><table><thead><tr><th class="num">#</th><th>Item</th><th class="num">Times bought</th><th class="num">Total qty</th><th class="num">Total spent</th><th>Last bought</th></tr></thead><tbody>${items.map((o,i)=>`<tr><td class="num muted">${i+1}</td><td>${esc(o.name)}${i===0?' <span class="tag ok">Top</span>':''}</td><td class="num">${o.n}</td><td class="num">${qf(o.qty)} ${esc(o.unit)}</td><td class="num">${money(o.amt)}</td><td>${fday(dkey(o.last))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No purchases in this period.</div>'}</section>
  <section class="panel sec"><div class="ph"><h2>Every item purchased</h2><span class="muted sm">${lines.length} line${lines.length===1?'':'s'}</span></div>${lines.length?`<div class="scroll"><table><thead><tr><th>Date</th><th>Receipt</th><th>Item</th><th>Batch</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Discount</th><th class="num">Line total</th><th>Location</th><th>Sold by</th></tr></thead><tbody>${lines.map(({s,l})=>`<tr class="click" data-s="${s.id}"><td>${fdate(s.date)}</td><td class="mono">${esc(s.no)}${s.voided?' <span class="tag bad">Voided</span>':s.type==='return'?' <span class="tag warn">Return</span>':''}</td><td>${esc(l.name)}</td><td>${esc(l.batches||'-')}</td><td class="num">${esc(qtyText(l,sgn(s)))}</td><td class="num">${money(l.unitPrice!=null?l.unitPrice:l.price)}</td><td class="num">${l.discAmt?money(l.discAmt):l.disc?qf(l.disc)+'%':'-'}</td><td class="num">${money(l.net*sgn(s))}</td><td>${esc(locName(s.locId))}</td><td>${esc(s.userName||'-')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nothing in this period.</div>'}</section>

  const rp=$('#rp');if(rp)rp.onclick=()=>payModal('customer',id);
  const ex=$('#ex');if(ex)ex.onclick=()=>exportRows('purchases-'+c.name.replace(/\W+/g,'-'),{Purchases:lines.map(({s,l})=>({Date:fdate(s.date),Receipt:s.no,Item:l.name,Batch:l.batches||'',Qty:qtyText(l,sgn(s)),'Base qty':l.qty*sgn(s),Price:l.unitPrice!=null?l.unitPrice:l.price,Discount:l.discAmt||0,Total:r2(l.net*sgn(s)),Location:locName(s.locId),'Sold by':s.userName,Status:s.voided?'Voided':'OK'}))});
  app.onclick=e=>{const tr=e.target.closest('tr[data-s]');if(tr)showReceipt(db.sales.find(x=>x.id===tr.dataset.s))};

function payModal(kind,id){
  const p=kind==='customer'?custById(id):suppById(id);
  openModal(`<h2>${kind==='customer'?'Payment from':'Payment to'} ${esc(p.name)}</h2><p class="muted" style="margin:0">Outstanding: <b class="mono">${money(p.owed)}</b></p>
  <form id="f" class="stack"><div class="grid2"><label class="f">Amount<input id="a" type="number" inputmode="decimal" min="0" step="any" value="${p.owed}" required></label>
  <label class="f">Method<select id="m"><option value="cash">Cash</option><option value="transfer">Transfer</option><option value="card">Card / POS</option></select></label></div>
  <div class="mactions"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" type="submit">Record payment</button></div></form>`,m=>{
    $('#f',m).onsubmit=e=>{e.preventDefault();const amt=Math.min(r2(num($('#a',m).value)),p.owed);if(amt<=0){toast('Enter an amount');return}
      p.owed=r2(p.owed-amt);db.ledger.push({id:uid(),date:nowISO(),kind,partyId:id,partyName:p.name,amt,method:$('#m',m).value,userId:cu.id,userName:cu.name,locId:curLoc});

      if(cur==='register'){renderCustInfo();updateTotals()}else if(cur==='customers')vCustomers();else if(cur==='suppliers')vSuppliers();toast('Payment recorded')};

function supplierDetail(id){
  const s=suppById(id);const recs=db.receivings.filter(r=>r.supplierId===id);
  const by={};recs.forEach(r=>r.lines.forEach(l=>{const o=by[l.itemId]||(by[l.itemId]={name:l.name,qty:0,amt:0,last:r.date,cost:l.cost,n:0});o.qty+=l.qty;o.amt+=l.qty*l.cost;o.n++;if(r.date>=o.last){o.last=r.date;o.cost=l.cost}}));

function expFiltered(){

function rSales(){
  const [from,to]=periodRange(RP.preset,RP.from,RP.to);const sales=periodSales(from,to);

/* ================= CLOUD BACKUP (server) ================= */
/* The connection details live in their own storage key, never inside the shop data,
   so a copied backup never contains the server sign-in token. */
const CLOUD_KEY='anabros-cloud';
function cloudGet(){try{return JSON.parse(store.get(CLOUD_KEY)||'null')}catch(e){return null}}
function cloudSet(c){store.set(CLOUD_KEY,c?JSON.stringify(c):'')}
function cloudSig(){return JSON.stringify(db,(k,v)=>k==='lastBackup'?undefined:v)}
function cloudHash(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return t.length+':'+h}
async function cloudCall(url,token,path,opt){
  opt=opt||{};const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),opt.timeout||20000);
  try{
    const headers={};if(token)headers.authorization='Bearer '+token;
    let body=opt.body;if(opt.json!==undefined){body=JSON.stringify(opt.json);headers['content-type']='application/json'}
    return await fetch(url+path,{method:opt.method||'GET',headers,body,signal:ctl.signal});
  }finally{clearTimeout(to)}
}
function cloudNetMsg(e){return 'Could not reach the server. Check the address and your internet. (This will not work inside the preview page. Use the downloaded copy of the app.)'}
function cloudCleanUrl(u){
  u=String(u||'').trim().replace(/\/+$/,'');if(!u)return'';
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  if(/^http:\/\//i.test(u)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(u))return'';
  return u;
}
async function cloudConnect(url,username,password,deviceName){
  const u=cloudCleanUrl(url);
  if(!u)throw new Error('Enter the server address. It must start with https:// (http:// is allowed only for localhost).');
  let h;try{const r=await cloudCall(u,'','/api/health');h=await r.json()}catch(e){throw new Error(cloudNetMsg(e))}
  if(!h||h.server!=='anabros-pos')throw new Error('That address is not an Anabros POS server.');
  if(!h.setup)throw new Error('That server has not been set up yet. See server/README.md, step "Set up your business".');
  const old=cloudGet();
  let r,d;try{r=await cloudCall(u,'','/api/login',{method:'POST',json:{username,password,deviceName,scope:'backup',deviceId:old&&old.url===u?old.deviceId:undefined}});d=await r.json()}catch(e){throw new Error(cloudNetMsg(e))}
  if(!r.ok)throw new Error(d.error||'Could not sign in.');
  cloudSet({url:u,username:d.user.username,token:d.token,expiresAt:d.expiresAt,deviceId:d.deviceId,deviceName,business:d.businessName,role:d.user.role,user:d.user.name,lastAt:old&&old.url===u?old.lastAt:'',lastBytes:old&&old.url===u?old.lastBytes:0,lastSig:old&&old.url===u?old.lastSig:'',err:''});
  return d;
}
async function cloudBackup(manual){
  const c=cloudGet();if(!c||!db||!c.token){if(manual)toast('Connect to a server first.');return false}
  if(!navigator.onLine){if(manual)toast('No internet right now. It will back up by itself when the connection returns.');return false}
  if(cloudBackup.busy)return false;cloudBackup.busy=true;
  try{
    const text=JSON.stringify(db);const sig=cloudHash(cloudSig());
    let r,d;try{r=await cloudCall(c.url,c.token,'/api/backup',{method:'PUT',body:text,timeout:90000});d=await r.json().catch(()=>({}))}
    catch(e){c.err=cloudNetMsg(e);cloudSet(c);if(manual)toast(c.err);return false}
    if(r.status===401){c.token='';c.err='The server signed this device out. Connect again.';cloudSet(c);if(manual)toast(c.err);return false}
    if(!r.ok){c.err=d.error||('The server answered '+r.status);cloudSet(c);if(manual)toast(c.err);return false}
    c.lastAt=nowISO();c.lastBytes=d.bytes;c.lastSig=sig;c.err='';cloudSet(c);
    db.lastBackup=nowISO();store.set(KEY,serializeDB());renderBanner();
    if(manual)toast('Backed up to the server');
    return true;
  }finally{cloudBackup.busy=false;if(cur==='setup'&&$('#cloudbox'))cloudDraw()}
}
function cloudTick(){
  if(LOCAL_EDITION)return;
  const c=cloudGet();if(!c||!c.token||!db||!cu||cu.role!=='admin'||(c.role&&c.role!=='admin'))return;
  if(cloudHash(cloudSig())===c.lastSig)return;
  cloudBackup(false);
}

function cloudRestore(){

  <label class="f">Server password<input id="dp" type="password" autocomplete="off" required></label><div class="sm bad-t" id="de"></div>

/* ================= SYNC BETWEEN DEVICES ================= */
/*ENGINE-START*/
/* The engine below has no screen code, so it can be tested on its own.
   How it works:
   - Each record (item, sale, customer, user...) is watched. When one changes, an operation is made:
       put   a new record (its whole contents)
       set   some fields of a record changed. Each field is merged on its own: the latest edit of that field wins,
             so one person changing a price and another changing the name both keep their change
       del   the record was deleted
       add   a number changed by +n or -n (stock quantity, what a customer owes, loyalty points, gift card balance).
             Additions from different devices never overwrite each other. They add up.
       push  a line was added to a history list (loyalty points log, gift card history)
   - Sales, receivings, expenses and similar records that are written once use latest-edit-wins for the whole record.
   - The activity log is only ever added to. Each device sends its own entries.
   - Operations from other devices are applied in the order the server gives them. Every device ends with the same data. */
const SY_MODE={locations:'f',items:'f',lots:'f',customers:'f',suppliers:'f',users:'f',taxes:'f',rules:'f',promos:'f',giftCards:'f',settings:'f',misc:'f',
  sales:'r',receivings:'r',transfers:'r',expenses:'r',ledger:'r',writeoffs:'r',shifts:'r'};
const SY_COLS=Object.keys(SY_MODE);
const SY_ONE={settings:1,misc:1};                      /* one record each: the shop settings, and the category lists */
const SY_SKIP={settings:['drawer']};                   /* things that belong to this device only (the cash drawer cable) */
const SY_ONLY={misc:['categories','expenseCats']};
const SY_ADD={lots:['qty'],customers:['owed','points'],suppliers:['owed'],giftCards:['balance']};
const SY_APP={customers:['pointsLog'],giftCards:['history']};
const syRound=n=>Math.round(n*1e6)/1e6;
const syClone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
function syStable(v){
  if(v===null||typeof v!=='object')return JSON.stringify(v)===undefined?'null':JSON.stringify(v);
  if(Array.isArray(v))return '['+v.map(syStable).join(',')+']';
  return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+syStable(v[k])).join(',')+'}';
}
function syHash(s){
  let a=5381,b=52711;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=(Math.imul(a,33)^c)|0;b=(Math.imul(b,31)+c)|0}
  return s.length+'.'+(a>>>0).toString(36)+'.'+(b>>>0).toString(36);
}
const syFh=v=>syHash(syStable(v));
const syGt=(a,b)=>a[0]>b[0]||(a[0]===b[0]&&a[1]>b[1]);
const syLast=rv=>{let b=[rv.t||0,rv.d||''];for(const f in rv.ft||{})if(syGt(rv.ft[f],b))b=rv.ft[f];return b};
function syRecs(db,col){
  if(col==='settings')return db.settings?[['main',db.settings]]:[];
  if(col==='misc')return [['main',db]];
  return (db[col]||[]).filter(r=>r&&r.id).map(r=>[r.id,r]);
}
function syOK(col,f){
  if(f==='__proto__'||f==='constructor'||f==='prototype')return false;
  if((SY_ADD[col]||[]).includes(f)||(SY_APP[col]||[]).includes(f)||(SY_SKIP[col]||[]).includes(f))return false;
  if(SY_ONLY[col])return SY_ONLY[col].includes(f);
  return !(col==='settings'&&f==='id');
}
function syStrip(col,r){const o={};for(const k in r)if(syOK(col,k))o[k]=r[k];return o}
const syFhs=base=>{const h={};for(const f in base)if(base[f]!==undefined)h[f]=syFh(base[f]);return h};
function syNew(dev,code){
  return {on:true,ver:2,epoch:'',dev,code:code||0,sid:Math.random().toString(36).slice(2,8),n:0,cursor:0,ts:0,rec:{},num:{},len:{},pend:{},out:[],auditMax:-1,lastSync:'',err:''};
}
const syAuditN=(e,code)=>{const m=/^i([0-9a-z]+)\.([0-9a-z]+)$/.exec(e&&e.id||'');return m&&code&&m[2]===code.toString(36)?parseInt(m[1],36):-1};
/* record everything now in `db` as already known (used when joining, starting, or upgrading) */
function sySnapshot(db,st){
  st.rec={};st.num={};st.len={};st.pend={};st.auditMax=-1;
  for(const col of SY_COLS)for(const [id,r] of syRecs(db,col)){
    const key=col+'|'+id,base=syStrip(col,r);
    st.rec[key]=SY_MODE[col]==='f'?{fh:syFhs(base),t:0,d:'',ft:{}}:{h:syFh(base),t:0,d:''};
    for(const f of SY_ADD[col]||[])st.num[key+'|'+f]=syRound(+r[f]||0);
    for(const f of SY_APP[col]||[])st.len[key+'|'+f]=(r[f]||[]).length;
  }
  for(const e of db.audit||[])st.auditMax=Math.max(st.auditMax,syAuditN(e,st.code));
  st.ver=2;
}
function syTick(st,now){st.ts=Math.max(now,st.ts+1);return st.ts}
function syEmit(st,op){op.id=st.dev+'.'+st.sid+'.'+(st.n++).toString(36);op.ts=op.ts||syTick(st,Date.now());st.out.push(op);return op}
/* find what changed on this device since the last look, and queue operations for it */
function syCapture(db,st,now){
  now=now||Date.now();let n=0;const seen={};
  for(const col of SY_COLS){
    const mode=SY_MODE[col];
    for(const [id,r] of syRecs(db,col)){
      const key=col+'|'+id;seen[key]=1;
      const base=syStrip(col,r),prev=st.rec[key];
      if(mode==='r'){
        const h=syFh(base);
        if(!prev||prev.x||prev.h!==h){const ts=syTick(st,now);syEmit(st,{t:'put',c:col,k:id,v:syClone(base),ts});st.rec[key]={h,t:ts,d:st.dev};n++}
      }else if(!prev||prev.x){
        const ts=syTick(st,now);syEmit(st,{t:'put',c:col,k:id,v:syClone(base),ts});st.rec[key]={fh:syFhs(base),t:ts,d:st.dev,ft:{}};n++;
      }else{
        const set={},u=[];
        for(const f in base){if(base[f]===undefined)continue;if(prev.fh[f]!==syFh(base[f]))set[f]=syClone(base[f])}
        for(const f in prev.fh)if(!(f in base)||base[f]===undefined)u.push(f);
        if(Object.keys(set).length||u.length){
          const ts=syTick(st,now);syEmit(st,{t:'set',c:col,k:id,v:set,u,ts});
          for(const f in set){prev.fh[f]=syFh(set[f]);prev.ft[f]=[ts,st.dev]}
          for(const f of u){delete prev.fh[f];prev.ft[f]=[ts,st.dev]}
          n++;
        }
      }
      for(const f of SY_ADD[col]||[]){
        const nk=key+'|'+f,cur=syRound(+r[f]||0),old=st.num[nk]||0;
        if(cur!==old){syEmit(st,{t:'add',c:col,k:id,f,d:syRound(cur-old)});st.num[nk]=cur;n++}
      }
      for(const f of SY_APP[col]||[]){
        const nk=key+'|'+f,a=r[f]||[],old=st.len[nk]||0;
        if(a.length>old){for(let i=old;i<a.length;i++)syEmit(st,{t:'push',c:col,k:id,f,v:syClone(a[i])});st.len[nk]=a.length;n++}
      }
    }
  }
  for(const key of Object.keys(st.rec)){
    if(seen[key]||st.rec[key].x)continue;
    const ts=syTick(st,now),i=key.indexOf('|'),col=key.slice(0,i),id=key.slice(i+1);
    syEmit(st,{t:'del',c:col,k:id,ts});st.rec[key]={x:1,t:ts,d:st.dev};n++;
    for(const f of SY_ADD[col]||[])delete st.num[key+'|'+f];
    for(const f of SY_APP[col]||[])delete st.len[key+'|'+f];
  }
  /* activity log: only this device's own new entries (their ids end with this device's code) */
  if(st.code&&Array.isArray(db.audit)){
    const fresh=[];
    for(const e of db.audit){const c=syAuditN(e,st.code);if(c>st.auditMax)fresh.push([c,e])}
    fresh.sort((a,b)=>a[0]-b[0]);
    for(const [c,e] of fresh){syEmit(st,{t:'put',c:'audit',k:e.id,v:syClone(e)});st.auditMax=Math.max(st.auditMax,c);n++}
  }
  return n;
}
/* apply operations from other devices (already in server order). Run syCapture first. */
function syApply(db,st,ops){
  const idx={};let auditIx=null,auditNew=false,applied=0;const dirty={};
  const ix=c=>idx[c]||(idx[c]=new Map(syRecs(db,c)));
  for(const op of ops){
    st.ts=Math.max(st.ts,op.ts||0);
    if(op.c==='audit'){
      if(op.t!=='put'||!op.v||!op.k)continue;
      if(!auditIx)auditIx=new Set((db.audit||[]).map(e=>e.id));
      if(!auditIx.has(op.k)){(db.audit||(db.audit=[])).push(op.v);auditIx.add(op.k);auditNew=true;applied++}
      continue;
    }
    const col=op.c,mode=SY_MODE[col];if(!mode)continue;
    const key=col+'|'+op.k,m=ix(col),rv=st.rec[key],tup=[op.ts,op.dv];
    if(op.t==='put'){
      const cur=rv?(rv.x?[rv.t,rv.d]:syLast(rv)):null;
      if(cur&&!syGt(tup,cur))continue;
      const nv={};for(const f in (op.v||{}))if(syOK(col,f))nv[f]=syClone(op.v[f]);
      let r=m.get(op.k);
      if(r){
        if(SY_ONE[col]){Object.assign(r,nv)}
        else{
          const keep={};for(const f of (SY_ADD[col]||[]).concat(SY_APP[col]||[],SY_SKIP[col]||[]))keep[f]=r[f];
          for(const k of Object.keys(r))delete r[k];Object.assign(r,nv,keep);
        }
      }else if(!SY_ONE[col]){
        r=Object.assign({id:op.k},nv);
        for(const f of SY_ADD[col]||[]){r[f]=syRound(st.pend[key+'|'+f]||0);delete st.pend[key+'|'+f];st.num[key+'|'+f]=r[f]}
        for(const f of SY_APP[col]||[]){r[f]=[];st.len[key+'|'+f]=0}
        (db[col]||(db[col]=[])).push(r);m.set(op.k,r);
      }else continue;
      const base=syStrip(col,r);
      st.rec[key]=mode==='f'?{fh:syFhs(base),t:op.ts,d:op.dv,ft:{}}:{h:syFh(base),t:op.ts,d:op.dv};applied++;
    }else if(op.t==='set'){
      const r=m.get(op.k);if(mode!=='f'||!r||!rv||rv.x)continue;
      for(const f in (op.v||{})){
        if(!syOK(col,f))continue;const cur=rv.ft[f]||[rv.t,rv.d];if(!syGt(tup,cur))continue;
        r[f]=syClone(op.v[f]);rv.fh[f]=syFh(op.v[f]);rv.ft[f]=tup;applied++;
      }
      for(const f of op.u||[]){
        if(!syOK(col,f))continue;const cur=rv.ft[f]||[rv.t,rv.d];if(!syGt(tup,cur))continue;
        delete r[f];delete rv.fh[f];rv.ft[f]=tup;applied++;
      }
    }else if(op.t==='del'){
      if(SY_ONE[col])continue;
      if(rv&&!syGt(tup,[rv.t,rv.d]))continue;   /* a delete beats later edits of the same record, so every device agrees */
      if(m.has(op.k)){m.delete(op.k);dirty[col]=1}
      st.rec[key]={x:1,t:op.ts,d:op.dv};
      for(const f of SY_ADD[col]||[]){delete st.num[key+'|'+f];delete st.pend[key+'|'+f]}
      for(const f of SY_APP[col]||[])delete st.len[key+'|'+f];
      applied++;
    }else if(op.t==='add'){
      if(rv&&rv.x)continue;
      if(!(SY_ADD[col]||[]).includes(op.f))continue;
      const r=m.get(op.k),nk=key+'|'+op.f;
      if(!r){st.pend[nk]=syRound((st.pend[nk]||0)+op.d);continue}
      r[op.f]=syRound((+r[op.f]||0)+op.d);st.num[nk]=syRound((st.num[nk]||0)+op.d);applied++;
    }else if(op.t==='push'){
      if(rv&&rv.x)continue;
      if(!(SY_APP[col]||[]).includes(op.f))continue;
      const r=m.get(op.k);if(!r)continue;
      (r[op.f]||(r[op.f]=[])).push(op.v);st.len[key+'|'+op.f]=r[op.f].length;applied++;
    }
  }
  for(const c of Object.keys(dirty)){const keep=ix(c);db[c]=db[c].filter(r=>keep.has(r.id))}

  return applied;
}
/*ENGINE-END*/

/* ---------- screen and server part ---------- */
const SY_LEASE='anabros-sync-lease';
/* only one open tab per browser does the syncing, so two tabs never send the same changes twice */
function syLead(){
  try{const l=JSON.parse(store.get(SY_LEASE)||'null'),t=Date.now();
    if(!l||l.tab===TAB_ID||t-l.t>20000){store.set(SY_LEASE,JSON.stringify({tab:TAB_ID,t}));return true}return false}
  catch(e){return true}
}
function syPersist(){if(db)store.set(KEY,serializeDB())}
function syFix(){if(SY&&SY.ver!==2&&db){sySnapshot(db,SY);syPersist()}}   /* an older sync state is rebuilt once, without sending anything */
function syKick(){
  if(!SY||!SY.on)return;syFix();
  clearTimeout(syT);
  syT=setTimeout(()=>{if(!SY||!SY.on||!db||!syLead())return;syCapture(db,SY);syPersist();syRun(false)},1500);
}
function syDraw(){
  const t=$('#syst');
  if(t){
    if(!SY||!SY.on)t.classList.add('hide');
    else{t.classList.remove('hide');const bad=!!SY.err,n=SY.out.length;
      t.textContent=bad?'Sync problem':n?'Sending '+n:'Synced';t.className='tag '+(bad?'bad':n?'warn':'ok');
      t.title=bad?SY.err:'Shared with your other devices'+(SY.lastSync?'. Last sync '+fdate(SY.lastSync):'')}
  }
  if(cur==='setup'&&$('#sybox'))syBoxDraw();
}
/* show the new data from other devices on screens that are safe to redraw */
function syRefresh(){
  if(!cu)return;
  const me=userById(cu.id);if(!me||me.active===false){logout('Your account was changed or switched off on another device.');return}
  cu=me;const br=$('#brand');if(br)br.innerHTML='<span>'+esc(S().name||'My Business')+'</span><small>Anabros POS</small>';
  refreshBadges();
  if(!$('#ov').classList.contains('hide'))return;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if(cur==='register'){if(typeof renderTiles==='function')renderTiles();return}
  if(['sales','items','customers','expiry','reports','cards','transfers','suppliers','locations','users','audit'].includes(cur))go();
}
async function syRun(manual){
  if(!SY||!SY.on||!db||syRun.busy)return;
  if(!syLead())return;
  const c=cloudGet();
  if(!c||!c.token){SY.err='Not connected to the server. Open Settings, Cloud backup, and connect again.';syPersist();syDraw();return}
  if(navigator.onLine===false){if(manual)toast('No internet. It will sync when the connection returns.');syDraw();return}
  syFix();
  syRun.busy=true;
  const fail=async(r,d)=>{
    if(r.status===403&&d.code==='erase'){deviceErase();throw new Error('This device was blocked.')}
    if(r.status===401){c.token='';c.err='The server signed this device out. Connect again.';cloudSet(c);throw new Error(c.err)}
    if(r.status===409){throw new Error('Syncing was restarted on the server. Take a backup, then join again (Settings, Cloud backup).')}
    throw new Error(d.error||'The server answered '+r.status);
  };

    syCapture(db,SY);syPersist();
    while(SY.out.length){
      const batch=[];let bytes=0;
      for(const o of SY.out){const s=JSON.stringify(o).length;if(batch.length&&(batch.length>=100||bytes+s>1500000))break;batch.push(o);bytes+=s}
      const r=await cloudCall(c.url,c.token,'/api/sync/push',{method:'POST',json:{epoch:SY.epoch,ops:batch},timeout:60000});
      const d=await r.json().catch(()=>({}));if(!r.ok)await fail(r,d);
      SY.out.splice(0,batch.length);syPersist();
    }
    let more=true,loops=0,got=0;
    while(more&&loops++<500){
      const r=await cloudCall(c.url,c.token,'/api/sync/pull?epoch='+encodeURIComponent(SY.epoch)+'&since='+SY.cursor,{timeout:60000});
      const d=await r.json().catch(()=>({}));if(!r.ok)await fail(r,d);

    if(manual)toast(got?'Synced. '+got+' change'+(got===1?'':'s')+' from other devices.':'Synced. Nothing new.');
  }catch(e){
    if(!SY||!db)return;
    SY.err=(e.name==='AbortError'||e instanceof TypeError)?'Could not reach the server. It will try again.':e.message;
    if(manual)toast(SY.err);
  }finally{syRun.busy=false;if(SY&&db)syPersist();syDraw()}
}
setInterval(()=>{if(SY&&SY.on&&db&&syLead()){if(syDirty){syDirty=false;syCapture(db,SY);syPersist()}syRun(false)}},15000);

  <label class="f">Server password<input id="qp" type="password" autocomplete="off" required></label><div class="sm bad-t" id="qe"></div>
  <div class="mactions"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" type="submit">${esc(btn)}</button></div></form>`,m=>{
    $('#qf',m).onsubmit=async e=>{e.preventDefault();const b=$('#qf button[type=submit]',m);b.disabled=true;$('#qe',m).textContent='';let tok='';
      try{
        const r=await cloudCall(c.url,'','/api/login',{method:'POST',json:{username:$('#qu',m).value,password:$('#qp',m).value,deviceName:c.deviceName,deviceId:c.deviceId,scope:'full'}});

function syStart(){

/* A new device opens the shop's own address and shows two choices.
   Sign in: any shop account (owner, admin, cashier) enters a username and password and the shop's data
   comes down by itself. Create account: the owner of a brand-new server sets everything up in one go. */
function wcDeviceName(){
  const ua=navigator.userAgent||'';
  const kind=/iPad|Tablet/i.test(ua)?'Tablet':/Mobi|Android|iPhone/i.test(ua)?'Phone':'Computer';
  const os=/Windows/i.test(ua)?'Windows':/Android/i.test(ua)?'Android':/iPhone|iPad|iOS/i.test(ua)?'iPhone/iPad':/Mac/i.test(ua)?'Mac':/Linux/i.test(ua)?'Linux':'';
  return (kind+(os?' ('+os+')':'')).slice(0,40);
}

async function wcSignIn(rawUrl,un,pw){
  const url=cloudCleanUrl(rawUrl);
  if(!url)throw new Error('Enter the server address. It must start with https://');
  const h=await wcHealth(url);
  if(!h.setup)throw new Error('This shop server has no owner yet. Go back and choose Create account.');
  let r,d;
  try{r=await cloudCall(url,'','/api/login',{method:'POST',json:{username:un,password:pw,deviceName:wcDeviceName(),scope:'backup'}});d=await r.json()}catch(e){throw new Error(cloudNetMsg(e))}
  if(!r.ok)throw new Error(d.error||'Could not sign in.');
  const tok=d.token,undo=()=>cloudCall(url,tok,'/api/logout',{method:'POST'}).catch(()=>{});
  try{
    let st;try{const sr=await cloudCall(url,tok,'/api/sync/status');st=await sr.json();if(!sr.ok)throw new Error(st.error||'The server answered '+sr.status)}catch(e){if(e instanceof TypeError||e.name==='AbortError')throw new Error(cloudNetMsg(e));throw e}
    if(!st.epoch)throw new Error('The shop owner has not finished setting up yet. Ask them to open the app and start syncing, then try again.');
    let br;try{br=await cloudCall(url,tok,'/api/sync/baseline',{timeout:120000})}catch(e){throw new Error(cloudNetMsg(e))}
    if(!br.ok){const x=await br.json().catch(()=>({}));throw new Error(x.error||'The server answered '+br.status)}
    const epoch=br.headers.get('x-epoch'),code=+br.headers.get('x-device-code')||0;let data;
    try{data=JSON.parse(await br.text())}catch(e){throw new Error('The shop data could not be read.')}
    if(!data||!Array.isArray(data.users))throw new Error('The shop data is not valid.');
    /* the starting copy plus everything done since, so accounts added today are there too */
    db=normalize(data);SY=syNew(d.deviceId,code);SY.epoch=epoch;sySnapshot(db,SY);
    for(let more=true,n=0;more&&n++<500;){
      let pr;try{pr=await cloudCall(url,tok,'/api/sync/pull?epoch='+encodeURIComponent(epoch)+'&since='+SY.cursor,{timeout:60000})}catch(e){throw new Error(cloudNetMsg(e))}
      const pd=await pr.json().catch(()=>({}));if(!pr.ok)throw new Error(pd.error||'The server answered '+pr.status);
      syApply(db,SY,pd.ops||[]);SY.cursor=pd.next;more=!!pd.more;
    }
    fixData();
    const lu=db.users.find(x=>x.username===un);
    if(!lu||lu.active===false||await hashPw(pw,lu.salt)!==lu.hash)throw new Error('You are signed in to the server, but this account is not in the shop\'s user list or is switched off. Ask the shop owner.');
    cloudSet({url,username:d.user.username,token:d.token,expiresAt:d.expiresAt,deviceId:d.deviceId,deviceName:wcDeviceName(),business:d.businessName,user:d.user.name,role:d.user.role,lastAt:'',lastBytes:0,lastSig:''});
    const u=lu;cu=u;u.lastLogin=nowISO();
    resetRegister();log('login','Signed in on a new device');save();
    enterApp(u);setTimeout(()=>syRun(false),800);
  }catch(e){db=null;SY=null;await undo();throw e}
}

async function wcCreate(rawUrl,f){
  const url=cloudCleanUrl(rawUrl);
  if(!url)throw new Error('Enter the server address. It must start with https://');
  if(f.pw.length<8)throw new Error('Use at least 8 characters for the password.');
  if(f.backup&&(f.backup.users||[]).some(x=>x.username===f.un))throw new Error('The backup already has someone with the username "'+f.un+'". Choose a different username for your new account.');
  const h=await wcHealth(url);
  if(h.setup)throw new Error('This server already has an owner. Go back and choose Sign in.');
  let r,d;
  try{r=await cloudCall(url,'','/api/setup',{method:'POST',json:{setupKey:f.key,businessName:f.biz,name:f.name,username:f.un,password:f.pw}});d=await r.json()}catch(e){throw new Error(cloudNetMsg(e))}
  if(!r.ok)throw new Error(d.error||'The server refused the setup.');
  /* the shop on this device, with the same username and password */
  if(f.backup){db=normalize(f.backup);fixData();if(!db.locations.length)db.locations.push({id:uid(),name:'Main Shop',type:'shop',address:'',active:true});if(f.biz)S().name=f.biz}
  else{db=blank();
  db.locations.push({id:uid(),name:'Main Shop',type:'shop',address:'',active:true});
  S().name=f.biz||S().name}
  const sl=salt();const u={id:uid(),name:f.name,username:f.un,salt:sl,hash:await hashPw(f.pw,sl),role:'admin',perms:[],locationIds:[],active:true,createdAt:nowISO(),lastLogin:nowISO()};
  db.users.push(u);if(f.sample&&!f.backup)seedSample();
  cu=u;curLoc=db.locations[0].id;log('setup',(f.backup?'Business set up from an older backup. ':'Business set up. ')+'Administrator account created for '+u.name);
  const code=genRecoveryCode();await setRecovery(code);log('recovery','Recovery code created');
  let problem='';
  try{
    const lr=await cloudCall(url,'','/api/login',{method:'POST',json:{username:f.un,password:f.pw,deviceName:wcDeviceName(),scope:'full'}});const ld=await lr.json();if(!lr.ok)throw new Error(ld.error||'Could not sign in to the server.');
    try{
      const br=await cloudCall(url,ld.token,'/api/sync/baseline',{method:'PUT',body:JSON.stringify(db),timeout:120000});const bd=await br.json().catch(()=>({}));if(!br.ok)throw new Error(bd.error||'The server answered '+br.status);
      SY=syNew(ld.deviceId,bd.code);SY.epoch=bd.epoch;sySnapshot(db,SY);
    }finally{cloudCall(url,ld.token,'/api/logout',{method:'POST'}).catch(()=>{})}
    const l2=await cloudCall(url,'','/api/login',{method:'POST',json:{username:f.un,password:f.pw,deviceName:wcDeviceName(),deviceId:ld.deviceId,scope:'backup'}});const d2=await l2.json();if(!l2.ok)throw new Error(d2.error||'Could not sign in to the server.');
    cloudSet({url,username:d2.user.username,token:d2.token,expiresAt:d2.expiresAt,deviceId:d2.deviceId,deviceName:wcDeviceName(),business:d2.businessName,user:d2.user.name,role:'admin',lastAt:'',lastBytes:0,lastSig:''});
  }catch(e){problem=(e instanceof TypeError||e.name==='AbortError')?cloudNetMsg(e):e.message;SY=null}
  save();
  showRecoveryCode(code,()=>{enterApp(u);if(problem)setTimeout(()=>toast('Your account was created, but syncing did not start: '+problem+' Open Settings, Cloud backup to connect.'),400);else{setTimeout(()=>syRun(false),800);cloudBackup(false).catch(()=>{})}});
}

/* ================= TODAY (phone-friendly manager view) AND STOCK TO CHECK ================= */
function chkData(){
  const locs=myLocs(),ids=locs.map(l=>l.id),out={};
  const itemsById={};db.items.forEach(i=>itemsById[i.id]=i);
  out.negative=[];out.expired=[];
  db.lots.forEach(l=>{if(!ids.includes(l.locId)||!itemsById[l.itemId])return;
    if(l.qty<-0.00001)out.negative.push(l);
    else if(l.qty>0.00001&&lotState(l)==='expired')out.expired.push(l)});
  out.low=[];out.noprice=[];
  db.items.forEach(i=>{if(i.active===false)return;
    const tot=stockAll(i.id);
    if(tot<=i.reorder&&tot>0)out.low.push({item:i,qty:tot});
    if(!(i.price>0)||!(i.cost>0))out.noprice.push(i)});
  const since=Date.now()-30*864e5,sold=new Set();
  db.sales.forEach(s=>{if(!s.voided&&s.type==='sale'&&ids.includes(s.locId)&&Date.parse(s.date)>=since)s.lines.forEach(l=>sold.add(l.itemId))});
  out.out=db.items.filter(i=>i.active!==false&&sold.has(i.id)&&stockAll(i.id)<=0.00001);
  out.short=db.transfers.filter(t=>(t.short||[]).length&&(isAdmin()||ids.includes(t.toLocId)||ids.includes(t.fromLocId))&&Date.now()-Date.parse(t.receivedAt||t.date)<60*864e5);
  out.cards=db.giftCards.filter(g=>g.balance<-0.004);
  out.points=db.customers.filter(c=>c.points<0);
  out.count=out.negative.length+out.expired.length+out.low.length+out.out.length+out.noprice.length+out.short.length+out.cards.length+out.points.length;
  return out;
}
function vCheck(){
  const d=chkData();
  const sec=(title,help,rows,head)=>`<section class="panel sec"><div class="ph"><h2>${title}</h2><span class="muted sm">${rows.length}</span></div><div class="pad sm muted" style="padding-bottom:0">${help}</div>${rows.length?`<div class="scroll"><table><thead><tr>${head.map((h,i)=>`<th${i&&h[0]==='#'?' class="num"':''}>${h.replace(/^#/,'')}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<div class="empty">Nothing to check.</div>'}</section>`;
  app.innerHTML=`<div class="page-h"><h1>Stock to check</h1></div>
  <div class="note" style="margin-bottom:14px">${d.count?`${d.count} thing${d.count===1?'':'s'} worth a look. These are things that usually mean a count is wrong, goods are about to run out, or two devices disagreed.`:'Nothing needs checking right now.'}</div>

function auSessions(userId){
  const by={};
  db.audit.filter(a=>(a.action==='login'||a.action==='logout')&&(!userId||a.userId===userId)).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0).forEach(a=>{(by[a.userId]=by[a.userId]||[]).push(a)});
  const out=[];
  for(const [id,list] of Object.entries(by)){let open=null;
    for(const a of list){
      if(a.action==='login'){if(open)out.push({...open,end:'',how:'No sign-out was recorded'});open={userId:id,name:a.userName,start:a.date}}
      else if(open){out.push({...open,end:a.date,how:auHow(a.detail)});open=null}
    }
    if(open)out.push({...open,end:'',how:'Still signed in, or no sign-out was recorded'});
  }
  return out.sort((x,y)=>x.start<y.start?1:-1);
}

function auFiltered(){
  const q=AU.q.trim().toLowerCase();const grp={sale:['sale','return','void'],expense:['expense','expense_edit','expense_delete'],receive:['receive'],transfer:['transfer_request','transfer_approve','transfer_decline','transfer_receive','transfer_cancel'],login:['login','logout','password'],admin:['user_add','user_edit','settings','import','export','location','tax','rule','category','batch_edit']};
  return db.audit.filter(a=>(!AU.user||a.userId===AU.user)&&(!AU.type||(grp[AU.type]||[]).includes(a.action))&&auInRange(a.date)&&(!q||a.detail.toLowerCase().includes(q)||(a.userName||'').toLowerCase().includes(q))).sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:0);
}
function auSessionRows(){
  const all=db.shifts||[],now=Date.now();
  const first=all.reduce((m,s)=>s.start<m?s.start:m,'9999');
  const mine=all.filter(s=>(!AU.user||s.userId===AU.user)&&auInRange(s.start)).map(s=>{
    const quiet=s.open&&now-Date.parse(s.end)>240000;
    return {userId:s.userId,name:s.userName,start:s.start,end:s.open&&!quiet?'':s.end,act:(s.actS||0)*1000,
      how:s.open?(quiet?'No update since then. The device may be offline, or closed':'Signed in now'):(s.how||'Signed out')}});
  /* sign ins from before working hours were tracked come from the activity log */
  const legacy=auSessions(AU.user).filter(s=>s.start<first&&auInRange(s.start)).map(s=>({...s,act:null}));
  return mine.concat(legacy).sort((x,y)=>x.start<y.start?1:-1);
}
/* working hours day by day: first sign in, last sign out, time signed in, time actually in use, sales */
function auHours(){
  const days={};
  auSessionRows().forEach(s=>{const k=dkey(s.start)+'|'+s.userId;const r=days[k]||(days[k]={day:dkey(s.start),name:s.name,first:s.start,last:'',ms:0,act:0,n:0,sales:0,open:false});
    r.n++;if(s.start<r.first)r.first=s.start;if(s.end){if(s.end>r.last)r.last=s.end;r.ms+=Math.max(0,Date.parse(s.end)-Date.parse(s.start))}else r.open=true;if(s.act)r.act+=s.act});
  db.audit.filter(a=>a.action==='sale'&&auInRange(a.date)&&(!AU.user||a.userId===AU.user)).forEach(a=>{const r=days[dkey(a.date)+'|'+a.userId];if(r)r.sales++});
  return Object.values(days).sort((x,y)=>x.day<y.day?1:x.day>y.day?-1:x.name<y.name?-1:1);
}
/* one line per person for the period: sign ins, time signed in, sales and other actions */
function auPeople(){
  const rows={};
  const row=(id,name)=>rows[id]||(rows[id]={id,name,sessions:0,ms:0,act:0,sales:0,sold:0,returns:0,other:0});
  db.audit.filter(a=>a.userId&&(!AU.user||a.userId===AU.user)&&auInRange(a.date)).forEach(a=>{const r=row(a.userId,a.userName);
    if(a.action==='sale'){r.sales++;r.sold=r2(r.sold+(a.amount||0))}else if(a.action==='return')r.returns++;else if(a.action!=='login'&&a.action!=='logout')r.other++});
  auSessionRows().forEach(s=>{const r=row(s.userId,s.name);r.sessions++;if(s.end)r.ms+=Math.max(0,Date.parse(s.end)-Date.parse(s.start));if(s.act)r.act+=s.act});
  return Object.values(rows).sort((x,y)=>y.sold-x.sold||y.sessions-x.sessions);
}
function auRows(){
  const list=auFiltered();
  const sold=r2(list.filter(a=>a.action==='sale').reduce((a,x)=>a+(x.amount||0),0)),spent=r2(list.filter(a=>a.action==='expense').reduce((a,x)=>a+(x.amount||0),0));
  $('#as').innerHTML=`<div class="stats" style="border-bottom:1px solid var(--line)">${stat('Actions listed',list.length)}${stat('Sold in listed actions',money(sold))}${stat('Spent in listed actions',money(spent))}</div>`;
  const pe=auPeople();
  $('#ap').innerHTML=pe.length?`<table><thead><tr><th>Person (this period)</th><th class="num">Sign ins</th><th class="num">Time signed in</th><th class="num">Time in use</th><th class="num">Sales</th><th class="num">Sales total</th><th class="num">Returns</th><th class="num">Other actions</th></tr></thead><tbody>${pe.map(r=>`<tr class="click" data-u="${r.id}"><td>${esc(r.name)}</td><td class="num">${r.sessions}</td><td class="num">${r.ms?auDur(r.ms):'-'}</td><td class="num">${r.act?auDur(r.act):'-'}</td><td class="num">${r.sales}</td><td class="num">${money(r.sold)}</td><td class="num">${r.returns}</td><td class="num">${r.other}</td></tr>`).join('')}</tbody></table><div class="pad sm muted">Tap a person to see only their activity.</div>`:'<div class="empty">No activity in this period.</div>';
  $('#ap').onclick=e=>{const tr=e.target.closest('tr[data-u]');if(tr){AU.user=tr.dataset.u;$('#au').value=AU.user;auRows()}};
  const hr=auHours();
  $('#ah').innerHTML=hr.length?`<table><thead><tr><th>Day</th><th>Person</th><th>First sign in</th><th>Last sign out</th><th class="num">Time signed in</th><th class="num">Time in use</th><th class="num">Sign ins</th><th class="num">Sales</th></tr></thead><tbody>${hr.slice(0,400).map(r=>`<tr><td style="white-space:nowrap">${fday(r.day)}</td><td>${esc(r.name)}</td><td>${fdateS(r.first).replace(/^.*?,\s*/,'')}</td><td>${r.last?fdateS(r.last).replace(/^.*?,\s*/,'')+(r.open?' (and one still open)':''):'-'}</td><td class="num">${r.ms?auDur(r.ms):'-'}</td><td class="num">${r.act?auDur(r.act):'-'}</td><td class="num">${r.n}</td><td class="num">${r.sales}</td></tr>`).join('')}</tbody></table><div class="pad sm muted"><b>Time signed in</b> is from sign in to sign out. <b>Time in use</b> counts only the time someone was really touching or typing in the app, so a person who left it open and walked away is not counted. A connection dropping does not end anything: hours are measured on the device and arrive when it is back online.</div>`:'<div class="empty">No working hours in this period.</div>';
  const ss=auSessionRows();
  $('#ase').innerHTML=ss.length?`<table><thead><tr><th>Person</th><th>Signed in</th><th>Signed out</th><th>Length</th><th>In use</th><th>How it ended</th></tr></thead><tbody>${ss.slice(0,300).map(s=>`<tr><td>${esc(s.name)}</td><td style="white-space:nowrap">${fdateS(s.start)}</td><td style="white-space:nowrap">${s.end?fdateS(s.end):'-'}</td><td>${s.end?auDur(Date.parse(s.end)-Date.parse(s.start)):'-'}</td><td>${s.act?auDur(s.act):'-'}</td><td>${esc(s.how)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No sign ins in this period.</div>';
  const box=$('#al');
  if(!list.length){box.innerHTML='<div class="empty">No activity matches.</div>';return}
  box.innerHTML=`<table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Details</th><th class="num">Amount</th></tr></thead><tbody>${list.slice(0,500).map(a=>`<tr${a.ref&&(a.action==='sale'||a.action==='return'||a.action==='void')?` class="click" data-s="${a.ref}"`:''}><td style="white-space:nowrap">${fdateS(a.date)}</td><td>${esc(a.userName||'-')}</td><td><span class="tag${['void','expense_delete','transfer_decline','item_delete'].includes(a.action)?' bad':['sale','expense','receive'].includes(a.action)?' ok':''}">${esc(ACTIONS[a.action]||a.action)}</span></td><td>${esc(a.detail)}<span class="sub">${esc(locName(a.locId))}</span></td><td class="num">${a.amount==null?'':money(a.amount)}</td></tr>`).join('')}</tbody></table>${list.length>500?'<div class="pad sm muted">Showing the latest 500. Narrow the filters or export to see more.</div>':''}`;
  box.onclick=e=>{const tr=e.target.closest('tr[data-s]');if(tr){const s=db.sales.find(x=>x.id===tr.dataset.s);if(s)showReceipt(s)}};
}


/* who is online right now (server edition): the server hears from every connected device */
async function auPresence(){
  const c=cloudGet(),box=$('#aot');if(!c||!box||cur!=='audit')return;
  try{
    const r=await cloudCall(c.url,c.token,'/api/presence');const d=await r.json();
    if(!$('#aot')||cur!=='audit')return;
    if(!r.ok){$('#aot').innerHTML='<div class="empty">'+esc(d.error||'Could not check.')+'</div>';return}
    const now=Date.parse(d.now),rows=d.devices.filter(v=>v.app_user||now-Date.parse(v.last_seen)<864e5*30).map(v=>({...v,on:!!v.app_user&&now-Date.parse(v.last_seen)<=90000}));
    rows.sort((a,b)=>(b.on-a.on)||(a.last_seen<b.last_seen?1:-1));
    const n=rows.filter(v=>v.on).length;$('#aonn').textContent=n+' online now';
    const using=rows.filter(v=>v.app_user),idle=rows.filter(v=>!v.app_user);
    $('#aot').innerHTML=(using.length?`<table><thead><tr><th>Person</th><th>Device</th><th>Signed in at</th><th>Status</th></tr></thead><tbody>${using.map(v=>`<tr><td>${esc(v.app_user)}</td><td>${esc(v.name)}</td><td style="white-space:nowrap">${v.since?fdateS(v.since):'-'}</td><td>${v.on?'<span class="tag ok">Online</span>':'<span class="tag">No connection</span><span class="sub">last heard from '+fdateS(v.last_seen)+'</span>'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nobody is signed in on any device right now.</div>')+(idle.length?`<div class="pad sm muted">Devices not in use (nobody signed in): ${idle.map(v=>esc(v.name)+' (last heard from '+fdateS(v.last_seen)+')').join(', ')}</div>`:'')+'<div class="pad sm muted">A device shows online while it can reach the server. If it stops reporting, it may be closed, switched off, or just without internet. Losing the connection does not sign anyone out, and the sign out time appears under Working hours once the device is back.</div>';
  }catch(e){if($('#aot'))$('#aot').innerHTML='<div class="empty">Could not reach the server.</div>'}
  clearTimeout(auPresence.t);auPresence.t=setTimeout(auPresence,20000);
}

const pick=(row,...names)=>{for(const n of names){const key=Object.keys(row).find(k=>k.trim().toLowerCase()===n.toLowerCase());if(key!==undefined&&row[key]!==''&&row[key]!=null)return row[key]}return''};
function excelDate(v){
  if(v===''||v==null)return'';
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?'':d.toISOString().slice(0,10)}
  if(v instanceof Date)return v.toISOString().slice(0,10);
  const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);

  const d=new Date(s);return isNaN(d)?'':d.toLocaleDateString('en-CA');
}

function buildImport(kind,rows,fields){
  const ok=[],skip=[];const has=k=>!fields||fields.has(k);const only=(d,keys)=>{const o={};keys.forEach(k=>{if(has(k))o[k]=d[k]});return o};
  if(kind==='items'){
    rows.forEach((r,i)=>{const name=String(pick(r,'name','item','item name','product')).trim();if(!name){skip.push({row:i+2,why:'No name'});return}
      const o={name,sku:String(pick(r,'barcode','sku','upc')).trim(),category:String(pick(r,'category')).trim(),cost:num(pick(r,'cost','cost price')),price:num(pick(r,'price','selling price')),reorder:pick(r,'reorder level','reorder')===''?5:num(pick(r,'reorder level','reorder')),
        alert:pick(r,'expiry warning days','warn days'),loc:String(pick(r,'location','shop','warehouse')).trim(),qty:num(pick(r,'quantity','qty','stock')),batch:String(pick(r,'batch','batch number','batch no')).trim(),exp:excelDate(pick(r,'expiry date','expiry','expires'))};
      const sh={Name:name};if(has('sku'))sh.Barcode=o.sku;if(has('category'))sh.Category=o.category;if(has('cost'))sh.Cost=o.cost;if(has('price'))sh.Price=o.price;if(has('reorder'))sh.Reorder=o.reorder;if(has('alert'))sh['Warn days']=o.alert;if(has('loc'))sh.Location=o.loc||(o.qty?locName(curLoc):'');if(has('qty'))sh.Qty=o.qty||'';if(has('batch'))sh.Batch=o.batch;if(has('exp'))sh.Expiry=o.exp;
      ok.push({d:o,show:sh})});
    return{ok,skip,summary:'Items with a matching barcode or name are updated. Quantity is added as new stock at the location named in the file (or your current location).',apply(){
      let n=0;ok.forEach(({d})=>{
        let it=(d.sku&&db.items.find(x=>x.sku===d.sku))||db.items.find(x=>x.name.toLowerCase()===d.name.toLowerCase());
        const f={name:d.name,...only(d,['sku','category','cost','price','reorder'])};if(has('alert'))f.expiryAlert=d.alert===''?'':Math.max(0,Math.round(num(d.alert)));
        if(it)Object.assign(it,f);else{it={id:uid(),sku:'',category:'',cost:0,price:0,reorder:5,expiryAlert:'',unit:'piece',units:[],...f};db.items.push(it)}
        if(has('category')&&d.category&&!cats().some(c=>c.toLowerCase()===d.category.toLowerCase()))db.categories.push(d.category);
        if(has('qty')&&d.qty>0){const dl=has('loc')?d.loc:'';let loc=db.locations.find(l=>l.name.toLowerCase()===dl.toLowerCase());if(!loc){if(dl){loc={id:uid(),name:dl,type:'shop',address:'',active:true};db.locations.push(loc)}else loc=locById(curLoc)||db.locations[0]}
          addLot({itemId:it.id,locId:loc.id,batchNo:(has('batch')&&d.batch)||'IMPORT',expiry:has('exp')?d.exp:'',qty:d.qty,cost:has('cost')?d.cost:it.cost})}
        n++});return n}};
  }
  if(kind==='customers'){
    rows.forEach((r,i)=>{const name=String(pick(r,'name','customer','full name')).trim();if(!name){skip.push({row:i+2,why:'No name'});return}
      const d={name,phone:String(pick(r,'phone','phone number','mobile')).trim(),email:String(pick(r,'email')).trim(),address:String(pick(r,'address')).trim(),cardNo:String(pick(r,'card number','card')).trim(),optIn:/^(y|yes|true|1)/i.test(String(pick(r,'accepts promotions','opt in')))};
      const sh={Name:name};[['phone','Phone'],['email','Email'],['address','Address'],['cardNo','Card'],['optIn','Promotions']].forEach(([k,l])=>{if(has(k))sh[l]=k==='optIn'?(d[k]?'Yes':'No'):d[k]});ok.push({d,show:sh})});
    return{ok,skip,summary:'Customers with the same phone number or email are updated.',apply(){let n=0;ok.forEach(({d})=>{
      const ex=db.customers.find(c=>(has('phone')&&d.phone&&c.phone===d.phone)||(has('email')&&d.email&&c.email&&c.email.toLowerCase()===d.email.toLowerCase())||(!has('phone')&&!has('email')&&c.name.toLowerCase()===d.name.toLowerCase()));
      const f={name:d.name,...only(d,['phone','email','address','cardNo','optIn'])};
      if(ex)Object.assign(ex,f);else db.customers.push({id:uid(),owed:0,points:0,pointsLog:[],notes:'',phone:'',email:'',address:'',cardNo:'',optIn:false,...f});n++});return n}};
  }
  if(kind==='suppliers'){
    rows.forEach((r,i)=>{const name=String(pick(r,'name','supplier','company')).trim();if(!name){skip.push({row:i+2,why:'No name'});return}
      const d={name,contact:String(pick(r,'contact','contact person')).trim(),phone:String(pick(r,'phone')).trim(),email:String(pick(r,'email')).trim(),address:String(pick(r,'address')).trim()};
      const sh={Name:name};[['contact','Contact'],['phone','Phone'],['email','Email'],['address','Address']].forEach(([k,l])=>{if(has(k))sh[l]=d[k]});ok.push({d,show:sh})});
    return{ok,skip,summary:'Suppliers with the same name are updated.',apply(){let n=0;ok.forEach(({d})=>{const ex=db.suppliers.find(s=>s.name.toLowerCase()===d.name.toLowerCase());const f={name:d.name,...only(d,['contact','phone','email','address'])};if(ex)Object.assign(ex,f);else db.suppliers.push({id:uid(),owed:0,contact:'',phone:'',email:'',address:'',...f});n++});return n}};
  }
  rows.forEach((r,i)=>{const amt=num(pick(r,'amount'));const dt=excelDate(pick(r,'date','date spent'));if(amt<=0){skip.push({row:i+2,why:'No amount'});return}
    const d={date:dt||todayKey(),category:String(pick(r,'category')).trim()||'Other',description:String(pick(r,'description','details','for')).trim()||'Imported expense',vendor:String(pick(r,'vendor','paid to')).trim(),amount:r2(amt),method:/transfer/i.test(pick(r,'method'))?'transfer':/card|pos/i.test(pick(r,'method'))?'card':'cash',loc:String(pick(r,'location')).trim()};
    const sh={Amount:d.amount};[['date','Date',d.date],['category','Category',d.category],['description','Description',d.description],['vendor','Vendor',d.vendor],['method','Method',d.method],['loc','Location',d.loc]].forEach(([k,l,v])=>{if(has(k))sh[l]=v});ok.push({d,show:sh})});
  return{ok,skip,summary:'Expenses are added as new entries under your name, with the date from the file.',apply(){let n=0;ok.forEach(({d})=>{

}

  $('#rf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#rt').value=r.result};r.readAsText(f)};
  $('#rrest').onclick=()=>{if(SY){toast('Leave syncing first (Settings, Cloud backup). A restore would break the link with the other devices.');return}let d;try{d=JSON.parse($('#rt').value)}catch(e){toast('That is not a valid backup');return}
    if(!d||!Array.isArray(d.items)||!d.settings||!Array.isArray(d.users)||!d.users.some(u=>u.role==='admin')){toast('That is not a valid backup from this version');return}
    confirmBox('Replace everything in this browser with the backup?',()=>{db=normalize(d);fixData();cu=userById(cu.id)||db.users.find(u=>u.role==='admin');resetRegister();save();renderTop();vSetup();toast('Backup restored')},'Restore')};
  const clr=$('#bclr');if(clr)clr.onclick=()=>confirmBox('Remove all example items, customers, suppliers, locations and sales? Your users and settings stay.',()=>{
    const keep={settings:db.settings,users:db.users,seq:db.seq,audit:db.audit};const fresh=blank();db=Object.assign(fresh,keep);
    db.locations.push({id:uid(),name:'Main Shop',type:'shop',address:'',active:true});db.users.forEach(u=>{if(u.role!=='admin')u.locationIds=[]});
    curLoc=db.locations[0].id;ses.set('jb-loc',curLoc);resetRegister();log('settings','Removed example data');save();renderTop();vSetup();toast('Example data removed')},'Remove');
  $('#bwipe').onclick=()=>SY?toast('Leave syncing first (Settings, Cloud backup).'):confirmBox('Delete all data, users and settings? You will set up again from the start. This cannot be undone.',()=>{store.set(KEY,'');try{localStorage.removeItem(KEY)}catch(e){}ses.del('jb-user');db=null;cu=null;location.hash='';showSetup()},'Delete everything');
}
function taxForm(id){
  const t=id?db.taxes.find(x=>x.id===id):{name:'',rate:'',inclusive:false};
  openModal(`<h2>${id?'Edit tax':'Add tax'}</h2><form id="f" class="stack"><div class="grid2"><label class="f">Name<input id="n" required value="${esc(t.name)}" placeholder="VAT"></label><label class="f">Rate (%)<input id="r" type="number" min="0" step="any" required value="${t.rate}"></label></div>
  <label class="f chk"><input type="checkbox" id="i"${t.inclusive?' checked':''}> Prices already include this tax</label><div class="mactions"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" type="submit">Save tax</button></div></form>`,m=>{
    $('#f',m).onsubmit=e=>{e.preventDefault();const d={name:$('#n',m).value.trim(),rate:num($('#r',m).value),inclusive:$('#i',m).checked};if(id)Object.assign(t,d);else db.taxes.push({id:uid(),...d});log('tax',(id?'Edited':'Added')+' tax '+d.name+' '+d.rate+'%');save();closeModal();vSetup()}});
}
function ruleForm(id){
  if(!db.items.length){toast('Add items first');return}
  const r=id?db.rules.find(x=>x.id===id):{name:'',itemId:db.items[0].id,minQty:10,percent:5,dtype:'pct',until:'',on:true};
  openModal(`<h2>${id?'Edit rule':'Add automatic discount'}</h2><form id="f" class="stack"><label class="f">Rule name<input id="n" required value="${esc(r.name)}" placeholder="e.g. Carton discount"></label>
  <label class="f">Item<select id="i">${db.items.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<option value="${i.id}"${i.id===r.itemId?' selected':''}>${esc(i.name)}</option>`).join('')}</select></label>
  <div class="grid3"><label class="f">When buying at least (in base units)<input id="q" type="number" min="1" step="any" required value="${r.minQty}"></label>
  <label class="f">Discount<span class="dsc"><input id="p" type="number" min="0" step="any" required value="${r.percent}"><select id="t" aria-label="Discount type"><option value="pct"${r.dtype!=='amt'?' selected':''}>%</option><option value="amt"${r.dtype==='amt'?' selected':''}>${esc(S().currency)}</option></select></span></label>
  <label class="f">Ends on (optional)<input id="u" type="date" value="${r.until}"></label></div>
  <div class="note" id="hn"></div>
  <label class="f chk"><input type="checkbox" id="on"${r.on!==false?' checked':''}> Rule is on</label><div class="mactions"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" type="submit">Save rule</button></div></form>`,m=>{
    const hint=()=>{const it=itemById($('#i',m).value);const u=(it&&it.unit)||'piece';$('#hn',m).textContent=$('#t',m).value==='amt'?'The amount comes off for every '+u+' sold once the minimum is reached. Quantities are counted in '+u+', even when sold by the carton or pack.':'The percentage comes off the whole line once the minimum is reached. Quantities are counted in '+u+', even when sold by the carton or pack.'};
    hint();$('#t',m).onchange=hint;$('#i',m).onchange=hint;
    $('#f',m).onsubmit=e=>{e.preventDefault();const dt=$('#t',m).value;const d={name:$('#n',m).value.trim(),itemId:$('#i',m).value,minQty:Math.max(1,num($('#q',m).value)),percent:dt==='pct'?Math.min(100,num($('#p',m).value)):Math.max(0,num($('#p',m).value)),dtype:dt,until:$('#u',m).value,on:$('#on',m).checked};if(id)Object.assign(r,d);else db.rules.push({id:uid(),...d});log('rule',(id?'Edited':'Added')+' discount rule '+d.name);save();closeModal();vSetup()}});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-te],[data-td],[data-re],[data-rd]');if(!b||cur!=='setup')return;
  if(b.dataset.te)taxForm(b.dataset.te);
  if(b.dataset.td)confirmBox('Delete this tax?',()=>{db.taxes=db.taxes.filter(t=>t.id!==b.dataset.td);log('tax','Deleted a tax');save();vSetup()},'Delete');
  if(b.dataset.re)ruleForm(b.dataset.re);
  if(b.dataset.rd)confirmBox('Delete this rule?',()=>{db.rules=db.rules.filter(t=>t.id!==b.dataset.rd);log('rule','Deleted a discount rule');save();vSetup()},'Delete');
});

/* ================= BOOT ================= */
function fixData(){
  db.customers.forEach(c=>{c.points=c.points||0;c.pointsLog=c.pointsLog||[];c.owed=c.owed||0;c.email=c.email||'';c.cardNo=c.cardNo||''});
  db.giftCards.forEach(g=>{g.history=g.history||[]});
  db.items.forEach(i=>{if(i.expiryAlert===undefined)i.expiryAlert=''});
  db.users.forEach(u=>{u.perms=u.perms||[];u.locationIds=u.locationIds||[]});
}
window.addEventListener('error',ev=>{try{const t=$('#toast');t.textContent='Something went wrong: '+(ev.message||'unknown error');t.classList.remove('hide')}catch(e){}});
(function boot(){
  loadDB();aliveSweep();renderBanner();
  if(!db||!db.users.length){LOCAL_EDITION?showSetup():showWelcome();return}
  fixData();
  const id=ses.get('jb-user');const u=id&&userById(id);
  if(sessionOK(u)){cu=u;enterApp(u)}else{if(id){ses.del('jb-user');ses.del('jb-alive');ses.del('jb-login-at')}showLogin()}
})();
})();
</script>
