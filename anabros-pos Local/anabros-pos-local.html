<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C6A54">
<!-- app starts here -->
<title>Anabros POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: top bar, grouped sidebar (drawer on phones), one working area. Register is catalog + cart. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface2:#E9EDE7; --ink:#14201B; --muted:#5B685F; --line:#D5DBD2;
  --accent:#0C6A54; --accent-ink:#FFFFFF; --accent-soft:#D9EEE6;
  --warn:#9A4A06; --warn-soft:#FBEACF; --bad:#B3261E; --bad-soft:#F8DBD8; --scrim:rgba(10,16,13,.55);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --surface2:#1F2B25; --ink:#E6EDE9; --muted:#95A59C; --line:#2B3932;
  --accent:#43C29F; --accent-ink:#052219; --accent-soft:#17382E;
  --warn:#EBA655; --warn-soft:#3A2A12; --bad:#F2887F; --bad-soft:#3E1C19; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface2:#1F2B25; --ink:#E6EDE9; --muted:#95A59C; --line:#2B3932;
  --accent:#43C29F; --accent-ink:#052219; --accent-soft:#17382E;
  --warn:#EBA655; --warn-soft:#3A2A12; --bad:#F2887F; --bad-soft:#3E1C19; --scrim:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)} .sm{font-size:12px}
.hide{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:10px;min-height:52px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--font-display);font-weight:700;font-size:15px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.hdr select{width:auto;max-width:200px;min-height:34px;padding:4px 8px}
.burger{display:none}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1640px;margin:0 auto}
.brand{line-height:1.15}.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);align-self:start;height:calc(100vh - 53px - env(safe-area-inset-top,0px));overflow:auto;padding:12px 10px 28px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
.side h4{margin:14px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side h4:first-child{margin-top:2px}
.side .ng{display:flex;align-items:center;gap:8px;width:100%;margin:6px 0 0;padding:10px 8px;border:0;border-radius:var(--r,8px);background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-align:left}
.side .ng:hover{background:var(--hover,rgba(127,127,127,.1))}
.side .ng>span:first-child{flex:1}
.side .ng .chev{font-size:18px;line-height:1;transition:transform .15s}
.side .ng.open .chev{transform:rotate(90deg)}
.side .ng.open{color:var(--fg)}
.side .ng.open .gb{display:none}
.side .ngl{display:grid;gap:0;padding-bottom:4px}
.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-weight:500}
.side a:hover{color:var(--ink);background:var(--surface2)}
.side a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center;font-weight:600}
.badge.w{background:var(--warn);color:var(--surface)}
main{padding:18px max(16px,env(safe-area-inset-right,0px)) 48px 22px;min-width:0}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:38}

.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pad{padding:14px}
.stack{display:grid;gap:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.filters>*{min-width:0}
.filters .grow{flex:1 1 220px}
.filters select,.filters input[type=date]{width:auto}
.scroll{overflow-x:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{padding:10px 12px;background:var(--surface2);border-radius:var(--r);color:var(--muted);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}

button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r);font-weight:500;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.small{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:38px;width:100%}
input:disabled,select:disabled{background:var(--surface2);color:var(--muted)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
textarea{resize:vertical;min-height:80px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
label.f.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.permgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.permgrid h4{grid-column:1/-1;margin:8px 0 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
th.num{text-align:right}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
tfoot td{font-weight:600;border-top:1px solid var(--line);background:var(--surface2)}
td .sub{display:block;font-size:12px;color:var(--muted)}
.rowacts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
a.lnk,button.lnk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-align:left;font-weight:500}

.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:3px;background:var(--surface2);color:var(--muted);font-weight:500;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.bad-t{color:var(--bad)} .ok-t{color:var(--accent)}

/* Register */
.reg{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;align-items:start}
.cartpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px)}
.catbar{padding:8px 14px 0}.catbar .btn{white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:14px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:96px}
.tile:hover{border-color:var(--accent)}
.tile .nm{font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile .pr{font-family:var(--font-mono);font-weight:500;margin-top:auto}
.tile .st{font-size:11.5px;color:var(--muted)}
.tile.out{opacity:.6}
.modes{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.modes button{flex:1;border:0;background:var(--surface);padding:6px 10px;color:var(--muted);font-weight:500}
.modes button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.modes.ret button[aria-pressed=true]{background:var(--warn-soft);color:var(--warn)}
.cart-lines{max-height:min(44vh,400px);overflow:auto}
.line{padding:10px 14px;border-bottom:1px solid var(--line)}
.line .l1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.line .l1 b{font-weight:500;overflow-wrap:anywhere}
.line .l2{display:grid;grid-template-columns:auto minmax(0,1fr) 64px auto;gap:8px;align-items:end;margin-top:8px}
.stepper{display:flex;align-items:center}
.stepper button{width:30px;height:34px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
.stepper button:first-child{border-radius:var(--r) 0 0 var(--r)}
.stepper button:last-child{border-radius:0 var(--r) var(--r) 0}
.stepper input{width:48px;text-align:center;border-radius:0;min-height:34px;padding:4px}
.line .l2 input.sm2{min-height:34px;padding:4px 8px}
.lt{font-family:var(--font-mono);font-weight:500;text-align:right;min-width:78px;padding-bottom:6px}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.tot{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.tot .r{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tot .r.big{font-size:15px;font-weight:600;padding-top:6px;margin-top:4px;border-top:1px dashed var(--line)}
.tot .r.big .mono{font-size:26px;font-family:var(--font-display);font-weight:700}
.tot .inl{display:flex;gap:6px;align-items:center}
.tot .inl input{width:70px;min-height:30px;padding:3px 8px;text-align:right}
.taxpick{display:flex;gap:12px;flex-wrap:wrap;padding-left:22px}
.pay{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pm button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 4px;font-size:13px;font-weight:500;color:var(--muted)}
.pm button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.payrow{display:flex;gap:8px}
.paylist{display:flex;flex-direction:column;gap:4px}
.paylist .p{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:var(--r);padding:4px 6px 4px 10px}
.status{display:flex;justify-content:space-between;font-weight:500}
.cartacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.cartacts .btn.primary{grid-column:1/-1;min-height:46px;font-size:16px}
.cartbar{display:none}

/* Reports */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{padding:14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--font-mono);font-size:19px;font-weight:500;margin-top:4px;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
svg.chart text{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .b{fill:var(--accent)}
.sec{margin-top:22px}
.sec>h2{margin-bottom:10px}

/* Messages */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:60vh}
.threads{border-right:1px solid var(--line);overflow:auto;max-height:70vh}
.thread{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px}
.thread:hover{background:var(--surface2)}
.thread[aria-current=true]{background:var(--accent-soft)}
.thread .p{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.convo{display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;max-height:56vh;min-height:300px}
.msg{max-width:78%;background:var(--surface2);border-radius:10px;padding:7px 11px;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--accent-soft)}
.msg .w{font-size:11px;color:var(--muted);margin-top:2px}
.composer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.logincard{width:100%;max-width:420px;display:grid;gap:14px;padding:22px}

/* Modal, toast, receipt */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;overflow:auto;display:flex;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:100%;max-width:560px;margin:auto;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.modal.wide{max-width:860px}
.mactions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);z-index:60;max-width:90vw;font-weight:500}
.receipt{font-family:var(--font-mono);font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 14px;font-weight:500;text-align:center}

@media (min-width:961px){.reg>.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);max-height:calc(100vh - 82px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain}.reg>.panel>.filters{position:sticky;top:0;z-index:3;background:var(--surface)}}
@media (max-width:1100px){.reg{grid-template-columns:minmax(0,1fr) 380px}}
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .burger{display:inline-block}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;height:auto;z-index:40;background:var(--surface);transform:translateX(-102%);padding-top:calc(env(safe-area-inset-top,0px) + 12px);border-right:1px solid var(--line)}
  .side.open{transform:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .reg{grid-template-columns:minmax(0,1fr)}
  .cartpanel{position:static}
  .cart-lines{max-height:none}
  .two{grid-template-columns:minmax(0,1fr)}
  .cartbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--accent);color:var(--accent-ink);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));justify-content:space-between;align-items:center;border:0;font-weight:600;width:100%}
  main{padding-bottom:96px}
}
@media (max-width:700px){
  .grid2,.grid3,.permgrid{grid-template-columns:minmax(0,1fr)}
  th,td{padding-left:10px;padding-right:10px}
  .chat{grid-template-columns:minmax(0,1fr)}
  .threads{border-right:0;border-bottom:1px solid var(--line);max-height:170px}
  .brand{max-width:36vw}
}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:border-color .12s,background .12s}.side{transition:transform .18s}}

.l3{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.l4{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;margin-top:8px}
.l4 input{min-height:34px;padding:4px 8px}
.dsc{display:flex;min-width:0}
.dsc input{border-radius:var(--r) 0 0 var(--r);min-width:0}
.dsc select{width:58px;flex:none;border-radius:0 var(--r) var(--r) 0;margin-left:-1px;padding:4px;min-height:34px}
.tot .dsc input{width:70px;min-height:30px;padding:3px 8px;text-align:right}
.tot .dsc select{min-height:30px}
.rline{border-bottom:1px solid var(--line);padding:12px 14px;display:grid;gap:10px}
.rline .rl1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.rgrid input,.rgrid select{min-width:0}
.rgrid .tv{font-family:var(--font-mono);font-weight:500;font-size:15px;min-height:38px;display:flex;align-items:center}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.masonry{column-count:2;column-gap:16px}.masonry>.panel{break-inside:avoid;-webkit-column-break-inside:avoid;margin:0 0 16px;display:block;width:100%}
@media (max-width:960px){.masonry{column-count:1}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.urow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
#printarea{display:none}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:5px;flex:none;border:1px solid var(--line);background:#fff}
.thumb.ph{display:inline-grid;place-items:center;background:var(--surface2);color:var(--muted);font-size:13px;font-weight:600}
.thumb.sm{width:24px;height:24px;font-size:11px}
.nmrow{display:flex;gap:8px;align-items:center;min-width:0}
.bclabel{display:inline-block;border:1px dashed #999;padding:6px 8px;margin:0 8px 8px 0;text-align:center;font-family:system-ui,sans-serif;font-size:11px;color:#000;background:#fff;vertical-align:top}
.bclabel b{display:block;font-size:11px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickrow{display:flex;gap:10px;align-items:center}
.prrec{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;margin:0;white-space:pre-wrap}
table.prt{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}

<script>
(function(){
'use strict';
const APP_VERSION='1.13.1';
const LOCAL_EDITION=true;   /* the build script sets this to true for the one-computer edition, which has no server features */
/* ================= CORE ================= */
const KEY='jb-pos-v2',OLDKEY='jb-pos-v1';
let SY=null,syDirty=false,syT=null; /* SY = syncing state of this device (null when syncing is off). It is saved together with the data in one write. */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const r4=x=>Math.round((x+Number.EPSILON)*10000)/10000;
const nowISO=()=>new Date().toISOString();
const dkey=iso=>new Date(iso).toLocaleDateString('en-CA');
const todayKey=()=>dkey(nowISO());
const relDate=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
const daysUntil=k=>Math.round((new Date(k+'T00:00:00')-new Date(todayKey()+'T00:00:00'))/864e5);
const fdate=iso=>new Date(iso).toLocaleString('en-NG',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fdateS=iso=>new Date(iso).toLocaleString('en-NG',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fday=k=>k?new Date(k+'T00:00:00').toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'}):'';
const sgn=s=>s.type==='return'?-1:1;
const qf=n=>String(+Number(n).toFixed(2));

let db=null,cu=null,curLoc='',cur='';
let mem={},storageOK=true;
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;return mem[k]||null}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){storageOK=false}}
};
const ses={
  get(k){try{return sessionStorage.getItem(k)}catch(e){return mem['s'+k]||null}},
  set(k,v){mem['s'+k]=v;try{sessionStorage.setItem(k,v)}catch(e){}},
  del(k){delete mem['s'+k];try{sessionStorage.removeItem(k)}catch(e){}}
};

const blank=()=>({v:2,sample:false,
  settings:{name:'My Business',address:'',phone:'',currency:'₦',footer:'Thank you for your patronage.',expiryDefault:60,allowExpiredSales:false,drawer:{mode:'off',when:'cash',baud:9600},blockOversell:true,
    loyalty:{on:false,perAmount:100,pointValue:1},email:{auto:true,serviceId:'',templateId:'',publicKey:'',fromName:''}},
  users:[],locations:[],categories:[],expenseCats:['Rent','Salaries','Transport','Fuel and power','Supplies','Marketing','Repairs','Other'],
  items:[],lots:[],customers:[],suppliers:[],sales:[],receivings:[],transfers:[],expenses:[],taxes:[],rules:[],giftCards:[],messages:[],outbox:[],campaigns:[],audit:[],held:[],ledger:[],
  promos:[],writeoffs:[],shifts:[],recovery:null,seq:{id:1,sale:1,recv:1,xfer:1,bc:1}});
function normalize(d){
  const b=blank(),ds=d.settings||{};const o=Object.assign(b,d);
  o.settings=Object.assign(blank().settings,ds);
  o.settings.loyalty=Object.assign(blank().settings.loyalty,ds.loyalty||{});
  o.settings.email=Object.assign(blank().settings.email,ds.email||{});
  o.settings.id='main';
  o.seq=Object.assign(blank().seq,d.seq||{});return o;
}
const devTag=()=>SY&&SY.code?'D'+SY.code+'-':'';
const uid=()=>'i'+(db.seq.id++).toString(36)+(SY&&SY.code?'.'+SY.code.toString(36):'');
const serializeDB=()=>SY?JSON.stringify(Object.assign({},db,{_sync:SY})):JSON.stringify(db);
function parseDB(raw){const o=JSON.parse(raw);const s=o._sync||null;delete o._sync;return {d:normalize(o),s}}
const S=()=>db.settings;
const itemById=id=>db.items.find(i=>i.id===id);
const custById=id=>db.customers.find(c=>c.id===id);
const suppById=id=>db.suppliers.find(s=>s.id===id);
const locById=id=>db.locations.find(l=>l.id===id);
const userById=id=>db.users.find(u=>u.id===id);
const locName=id=>{const l=locById(id);return l?l.name:'(removed location)'};
const cats=()=>[...new Set([...(db.categories||[]),...db.items.map(i=>i.category).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));
const money=n=>{const t=Math.abs(n).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});return(n<-0.004?'-':'')+S().currency+t};
const PAYNAMES={cash:'Cash',transfer:'Transfer',card:'Card / POS',giftcard:'Gift card',points:'Loyalty points',credit:'On account'};

/* ---------- persistence ---------- */
function save(){
  if(!db)return;
  if(db.audit.length>20000)db.audit.length=20000;
  store.set(KEY,serializeDB());renderBanner();
  if(SY&&SY.on&&typeof syKick==='function')syKick();
  if(typeof refreshBadges==='function'&&cu)refreshBadges();
}
function renderBanner(){const adm=cu&&cu.role==='admin'&&db;const one=adm&&db.users.filter(u=>u.role==='admin'&&u.active!==false).length<2;const bk=adm&&(!db.lastBackup||(Date.now()-new Date(db.lastBackup))>14*864e5);
  $('#banner').innerHTML=(one?'<div class="banner">You have only one admin account. Create a second admin held by someone you trust, so a forgotten password never locks you out. <button class="lnk" type="button" data-go="users">Open Users</button></div>':'')+(bk?'<div class="banner">'+(db.lastBackup?'Your last backup was over 2 weeks ago.':'You have not copied a backup yet.')+' Copy one in Settings and keep it somewhere safe. <button class="lnk" type="button" data-go="setup">Open Settings</button></div>':'')+(cu&&cu.role==='admin'&&db&&!db.recovery?'<div class="banner">No recovery code yet. Create one in Settings so an admin can never be locked out. <button class="lnk" type="button" data-go="setup">Open Settings</button></div>':'')+(storageOK?'':'<div class="banner">This browser is blocking storage, so changes will be lost when you close the page. Export a backup from Settings often.</div>')}
function loadDB(){
  const raw=store.get(KEY);
  if(raw){try{const p=parseDB(raw);db=p.d;SY=p.s;return}catch(e){}}
  const old=store.get(OLDKEY);
  if(old){try{db=migrate(JSON.parse(old));return}catch(e){db=null}}
}
function migrate(o){
  const n=blank();db=n;const st=o.settings||{};
  Object.assign(n.settings,{name:st.name||n.settings.name,address:st.address||'',phone:st.phone||'',currency:st.currency||'₦',footer:st.footer||''});
  n.seq.id=(o.seq&&o.seq.id)||1;n.seq.sale=(o.seq&&o.seq.sale)||1;n.seq.recv=(o.seq&&o.seq.recv)||1;
  const loc={id:uid(),name:'Main Shop',type:'shop',address:st.address||'',active:true};n.locations.push(loc);
  if(st.taxRate>0)n.taxes.push({id:uid(),name:'VAT',rate:st.taxRate,inclusive:!!st.taxInclusive});
  (o.items||[]).forEach(i=>{n.items.push({id:i.id,name:i.name,sku:i.sku||'',category:i.category||'',cost:i.cost||0,price:i.price||0,reorder:i.reorder==null?5:i.reorder,expiryAlert:''});
    if(i.category&&!n.categories.includes(i.category))n.categories.push(i.category);
    if(i.stock>0)addLot({itemId:i.id,locId:loc.id,batchNo:'OPENING',expiry:'',qty:i.stock,cost:i.cost||0})});
  (o.customers||[]).forEach(c=>n.customers.push({...c,points:0,cardNo:'',optIn:false}));
  n.suppliers=o.suppliers||[];
  n.sales=(o.sales||[]).map(s=>({...s,locId:loc.id,userId:'',userName:s.cashier||'',taxes:s.tax?[{name:'Tax',rate:st.taxRate||0,amt:s.tax}]:[]}));
  n.receivings=(o.receivings||[]).map(r=>({...r,locId:loc.id,userId:'',userName:'',lines:r.lines.map(l=>({...l,batchNo:'',expiry:''}))}));
  n.ledger=o.ledger||[];n.held=(o.held||[]).map(h=>({...h,locId:loc.id}));
  return n;
}

/* ---------- accounts and permissions ---------- */
const PERMS=[
  ['sell','Make sales','Sales'],['discount','Give discounts and change prices','Sales'],['returns','Process customer returns','Sales'],['void','Void sales','Sales'],['sales_all','See sales made by other users','Sales'],
  ['customers','Add and edit customers, see what they bought','People'],['suppliers','Add and edit suppliers, see what they supplied','People'],['giftcards','Manage gift cards and loyalty points','People'],['marketing','Send promotions and newsletters','People'],
  ['items_view','View items and stock','Stock'],['items_edit','Add and edit items and categories','Stock'],['stock_adjust','Adjust stock counts','Stock'],['receive','Receive goods with batch and expiry','Stock'],['expiry','See expiry alerts','Stock'],
  ['oversell','Sell more than is in stock','Sales'],['drawer','Open the cash drawer without a sale','Sales'],['sell_expired','Sell expired goods','Sales'],['stock_remove','Remove stock (faulty, damaged, expired, used)','Stock'],['promo','Create promotions on items','Stock'],['transfers_request','Request stock from other locations','Stock'],['transfers_approve','Approve transfers out of their own location','Stock'],
  ['expenses_add','Add expenses','Money'],['expenses_all','See, edit and delete all expenses','Money'],['reports','View reports','Money'],
  ['audit','See the activity log','Admin'],['data','Import and export Excel files','Admin']];
const ALLP=PERMS.map(p=>p[0]);
const PRESETS={
  salesexp:{label:'Sales and expenses only',perms:['sell','expenses_add']},
  shoprep:{label:'Shop rep',perms:['sell','returns','customers','items_view','expiry','receive','transfers_request','transfers_approve','expenses_add']},
  manager:{label:'Manager',perms:ALLP.filter(p=>p!=='audit')},
  custom:{label:'Custom',perms:[]}};
const can=p=>!!cu&&cu.active!==false&&(cu.role==='admin'||(cu.perms||[]).includes(p));
const isAdmin=()=>!!cu&&cu.role==='admin';
const myLocs=()=>db.locations.filter(l=>l.active!==false&&(isAdmin()||(cu.locationIds||[]).includes(l.id)));
async function hashPw(pw,salt){
  const s=salt+':'+pw;
  try{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return'x'+(h>>>0).toString(16)}
}
const salt=()=>Math.random().toString(36).slice(2,10);

/* ---------- activity log ---------- */
function log(action,detail,extra){
  db.audit.unshift({id:uid(),date:nowISO(),userId:cu?cu.id:'',userName:cu?cu.name:'System',action,detail,locId:curLoc,...(extra||{})});
}

/* ---------- stock lots (batch + expiry) ---------- */
const alertDays=it=>it&&it.expiryAlert!==''&&it.expiryAlert!=null?+it.expiryAlert:S().expiryDefault;
function lotState(l){if(!l.expiry)return'none';const d=daysUntil(l.expiry);return d<0?'expired':d<=alertDays(itemById(l.itemId))?'near':'ok'}
const lotsFor=(itemId,locId)=>db.lots.filter(l=>l.itemId===itemId&&l.qty>0.00001&&(!locId||l.locId===locId));
const qtyAt=(itemId,locId)=>r4(lotsFor(itemId,locId).reduce((a,l)=>a+l.qty,0));
const expOK=()=>!!(S().allowExpiredSales||can('sell_expired'));
const canOver=()=>!S().blockOversell||can('oversell');
const availAt=(itemId,locId)=>r4(lotsFor(itemId,locId).filter(l=>expOK()||lotState(l)!=='expired').reduce((a,l)=>a+l.qty,0));
function planTake(itemId,locId,qty,allowExpired,lotId){
  let need=qty;const out=[];
  let ls=lotsFor(itemId,locId).filter(l=>allowExpired||lotState(l)!=='expired').sort((a,b)=>{const ea=a.expiry||'9999',eb=b.expiry||'9999';return ea<eb?-1:ea>eb?1:(a.recvAt<b.recvAt?-1:1)});
  if(lotId)ls=ls.filter(l=>l.id===lotId);
  for(const l of ls){if(need<=0.00001)break;const t=Math.min(l.qty,need);out.push({lotId:l.id,batchNo:l.batchNo,expiry:l.expiry,qty:r4(t),cost:l.cost,price:l.price});need=r4(need-t)}
  return{allocs:out,short:Math.max(0,need)};
}
function commitTake(allocs){allocs.forEach(a=>{const l=db.lots.find(x=>x.id===a.lotId);if(l)l.qty=Math.max(0,r4(l.qty-a.qty))})}
function addLot(o){
  let l=db.lots.find(x=>x.itemId===o.itemId&&x.locId===o.locId&&x.batchNo===(o.batchNo||'')&&(x.expiry||'')===(o.expiry||''));
  if(l){const base=Math.max(l.qty,0);l.cost=(base+o.qty)>0?r4((l.cost*base+o.cost*o.qty)/(base+o.qty)):o.cost;l.qty=r4(l.qty+o.qty);if(o.price!==undefined&&o.price!==''&&o.price!=null)l.price=o.price}
  else{l={id:uid(),itemId:o.itemId,locId:o.locId,batchNo:o.batchNo||'',expiry:o.expiry||'',qty:r4(o.qty),cost:o.cost||0,price:(o.price===undefined||o.price==null)?'':o.price,recvAt:o.recvAt||nowISO()};db.lots.push(l)}
  return l;
}
function restoreAlloc(a,itemId,locId){const q=Math.max(0,r4(a.qty-(a.over||0)));const l=db.lots.find(x=>x.id===a.lotId);if(l&&l.locId===locId)l.qty=r4(l.qty+q);else if(q>0)addLot({itemId,locId,batchNo:a.batchNo,expiry:a.expiry,qty:q,cost:a.cost})}
const stockAll=itemId=>r4(db.lots.filter(l=>l.itemId===itemId&&l.qty>0.00001).reduce((a,l)=>a+l.qty,0));
const lineCost=l=>l.costTotal!=null?l.costTotal:(l.cost||0)*l.qty;
function autoDisc(itemId,baseQty,gross){
  let best={amt:0,label:''};const t=todayKey();
  db.rules.forEach(r=>{if(r.on===false||r.itemId!==itemId||baseQty<r.minQty-1e-9||(r.until&&t>r.until))return;
    const amt=r.dtype==='amt'?Math.min(gross,r2(r.percent*baseQty)):r2(gross*r.percent/100);
    if(amt>best.amt)best={amt,label:r.dtype==='amt'?money(r.percent)+' off each':qf(r.percent)+'% off'}});
  return best;
}

/* ---------- toast, modal, clipboard ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hide'),2800)}
function copyText(text,okMsg){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?okMsg:'Copy failed. Select the text and copy it by hand.')};
  try{navigator.clipboard.writeText(text).then(()=>toast(okMsg),fb)}catch(e){fb()}
}
function openModal(html,mount,wide){
  const md=$('#md');md.className='modal'+(wide?' wide':'');md.innerHTML=html;
  $('#ov').classList.remove('hide');if(mount)mount(md);
  const f=$('input:not([type=hidden]):not([type=file]),select,textarea',md);if(f&&!wide)f.focus();
}
let modalLock=false,onModalClose=null;
function closeModal(){$('#ov').classList.add('hide');$('#md').innerHTML='';modalLock=false;const f=onModalClose;onModalClose=null;if(f)try{f()}catch(e){}}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov'&&!modalLock)closeModal()});
$('#ov').addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modalLock&&!$('#ov').classList.contains('hide'))closeModal()});
function confirmBox(msg,yes,label,danger){
  openModal(`<h2>${esc(msg)}</h2><div class="mactions"><button class="btn" data-close type="button">Cancel</button><button class="btn ${danger===false?'primary':'danger'}" id="cy" type="button">${esc(label||'Confirm')}</button></div>`,m=>{$('#cy',m).onclick=()=>{closeModal();yes()}});
}
function guard(p){if(can(p))return true;toast('Your account is not allowed to do that.');return false}

/* ---------- charts ---------- */
function compact(n){const a=Math.abs(n);if(a>=1e6)return(+(n/1e6).toFixed(2))+'M';if(a>=1e3)return(+(n/1e3).toFixed(1))+'k';return String(+n.toFixed(a<10?1:0))}
function niceMax(v){if(v<=0)return 10;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function barChart(data,fmt){
  fmt=fmt||money;
  const W=720,H=230,L=52,Rm=8,T=10,B=28;const iw=W-L-Rm,ih=H-T-B;
  const max=niceMax(Math.max(...data.map(d=>d.val),0));const n=data.length;const step=iw/n;const bw=Math.max(2,Math.min(40,step*.68));
  let g='';for(let k=0;k<=4;k++){const y=T+ih-ih*k/4;g+=`<line class="grid" x1="${L}" x2="${W-Rm}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${compact(max*k/4)}</text>`}
  const every=Math.ceil(n/8);let bars='',lab='';
  data.forEach((d,i)=>{const h=ih*Math.max(0,d.val)/max;const x=L+step*i+(step-bw)/2;
    bars+=`<rect class="b" x="${x.toFixed(1)}" y="${(T+ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"><title>${esc(d.label)}: ${esc(fmt(d.val))}</title></rect>`;
    if(i%every===0||i===n-1)lab+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(d.short)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bar chart">${g}${bars}${lab}</svg>`;
}
/* time series helper: returns [{label,short,val}] grouped by day (or month if long) */
function seriesBuckets(from,to,pairs){
  const days=[];{const a=new Date(from+'T00:00:00'),b=new Date(to+'T00:00:00');for(let d=new Date(a);d<=b&&days.length<4000;d.setDate(d.getDate()+1))days.push(d.toLocaleDateString('en-CA'))}
  const monthly=days.length>62;const m=new Map();
  days.forEach(k=>m.set(monthly?k.slice(0,7):k,0));
  pairs.forEach(([k,v])=>{const key=monthly?k.slice(0,7):k;if(m.has(key))m.set(key,m.get(key)+v)});
  return [...m].map(([k,v])=>{const d=new Date((monthly?k+'-01':k)+'T00:00:00');return{label:monthly?d.toLocaleDateString('en-NG',{month:'long',year:'numeric'}):d.toLocaleDateString('en-NG',{weekday:'short',day:'numeric',month:'short'}),short:monthly?d.toLocaleDateString('en-NG',{month:'short',year:'2-digit'}):d.toLocaleDateString('en-NG',{day:'numeric',month:'short'}),val:v}});
}
function periodRange(preset,cf,ct){
  const t=todayKey();const add=(k,d)=>{const x=new Date(k+'T00:00:00');x.setDate(x.getDate()+d);return x.toLocaleDateString('en-CA')};
  if(preset==='today')return[t,t];if(preset==='7')return[add(t,-6),t];if(preset==='30')return[add(t,-29),t];
  if(preset==='month')return[t.slice(0,8)+'01',t];
  if(preset==='all'){const ks=db.sales.map(s=>dkey(s.date)).sort();return[ks[0]||t,t]}
  return[cf||t,ct||t];
}

/* ---------- barcodes ---------- */
const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R=EAN_L.map(s=>s.replace(/[01]/g,c=>c==='0'?'1':'0'));
const EAN_P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
const C39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn','*':'nwnnwnwnn'};
function eanCheck(d12){let s=0;for(let i=0;i<12;i++)s+=(+d12[i])*(i%2?3:1);return String((10-s%10)%10)}
function newBarcode(){let c;do{c=SY&&SY.code?'2'+String(SY.code%100).padStart(2,'0')+String(db.seq.bc++).padStart(9,'0'):'2'+String(db.seq.bc++).padStart(11,'0');c+=eanCheck(c)}while(db.items.some(i=>i.sku===c));return c}
function barcodeBits(code){
  let c=String(code).trim();
  if(/^\d{12}$/.test(c))c+=eanCheck(c);
  if(/^\d{13}$/.test(c)&&eanCheck(c.slice(0,12))===c[12]){
    const par=EAN_P[+c[0]];let b='101';
    for(let i=1;i<=6;i++)b+=(par[i-1]==='L'?EAN_L:EAN_G)[+c[i]];
    b+='01010';for(let i=7;i<=12;i++)b+=EAN_R[+c[i]];b+='101';
    return{type:'EAN-13',bits:b,text:c,quiet:9};
  }
  const t=c.toUpperCase().replace(/[^0-9A-Z\-. $\/+%]/g,'-')||'-';
  let b='';[...('*'+t+'*')].forEach((ch,idx)=>{const p=C39[ch];if(idx)b+='0';
    for(let i=0;i<9;i++){const w=p[i]==='w'?3:1;b+=(i%2===0?'1':'0').repeat(w)}});
  return{type:'Code 39',bits:b,text:t,quiet:10};
}
function barcodeSVG(code,h){
  const o=barcodeBits(code);const mw=2,H=h||56,q=o.quiet;const W=(o.bits.length+q*2)*mw;
  let rects='',i=0;while(i<o.bits.length){if(o.bits[i]==='1'){let j=i;while(o.bits[j]==='1')j++;rects+=`<rect x="${(q+i)*mw}" y="0" width="${(j-i)*mw}" height="${H}" fill="#000"/>`;i=j}else i++}
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H+16}" width="${W/2}" height="${(H+16)/2}" role="img" aria-label="Barcode ${esc(o.text)}"><rect width="${W}" height="${H+16}" fill="#fff"/>${rects}<text x="${W/2}" y="${H+12}" text-anchor="middle" font-family="monospace" font-size="12" fill="#000">${esc(o.text)}</text></svg>`;
}

function parseDelimited(text){
  const first=(text.split(/\r?\n/).find(l=>l.trim())||'');const d=first.includes('\t')?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else f+=ch}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows;
}

/* ---------- cash drawer (ESC/POS kick pulse) ---------- */
const DRAWER_CMD=new Uint8Array([0x1b,0x70,0x00,0x19,0xfa]);
let dwPort=null,dwDev=null;
const drawerCfg=()=>Object.assign({mode:'off',when:'cash',baud:9600},S().drawer||{});
const drawerSupport=()=>({serial:!!navigator.serial,usb:!!navigator.usb});
async function drawerConnect(){
  const c=drawerCfg();
  if(c.mode==='serial'){if(!navigator.serial)throw new Error('This browser cannot use serial devices. Use Chrome or Edge.');dwPort=await navigator.serial.requestPort();return 'Serial device chosen.'}
  if(c.mode==='usb'){if(!navigator.usb)throw new Error('This browser cannot use USB devices. Use Chrome or Edge.');dwDev=await navigator.usb.requestDevice({filters:[]});return 'USB device chosen: '+(dwDev.productName||'unnamed')}
  throw new Error('Choose Serial or USB first.');
}
async function drawerKick(){
  const c=drawerCfg();
  try{
    if(c.mode==='serial'){
      if(!navigator.serial)return{ok:false,why:'This browser cannot use serial devices.'};
      if(!dwPort){const ps=await navigator.serial.getPorts();dwPort=ps[0]||null}
      if(!dwPort)return{ok:false,why:'No drawer connected. Settings > Cash drawer > Connect.'};
      if(!dwPort.writable)await dwPort.open({baudRate:+c.baud||9600});
      const w=dwPort.writable.getWriter();try{await w.write(DRAWER_CMD)}finally{w.releaseLock()}
      return{ok:true};
    }
    if(c.mode==='usb'){
      if(!navigator.usb)return{ok:false,why:'This browser cannot use USB devices.'};
      if(!dwDev){const ds=await navigator.usb.getDevices();dwDev=ds[0]||null}
      if(!dwDev)return{ok:false,why:'No drawer connected. Settings > Cash drawer > Connect.'};
      if(!dwDev.opened)await dwDev.open();
      if(dwDev.configuration===null)await dwDev.selectConfiguration(1);
      let ep=null,ifn=null;
      for(const i of dwDev.configuration.interfaces){const a=i.alternates[0];const o=a.endpoints.find(e=>e.direction==='out');if(o){ep=o.endpointNumber;ifn=i.interfaceNumber;break}}
      if(ep==null)return{ok:false,why:'That USB device has no output channel.'};
      try{await dwDev.claimInterface(ifn)}catch(e){}
      await dwDev.transferOut(ep,DRAWER_CMD);
      return{ok:true};
    }
    return{ok:false,why:c.mode==='driver'?'driver':'off'};
  }catch(e){return{ok:false,why:(e&&e.message)||'The drawer did not respond.'}}
}
/* Manual open. Needs the "drawer" permission and is always logged. */
async function openDrawerManual(){
  const c=drawerCfg();
  if(c.mode==='off'){toast('The cash drawer is turned off in Settings.');return}
  if(!can('drawer')){toast('Your account is not allowed to open the drawer without a sale.');return}
  if(c.mode==='driver'){log('drawer','Opened the cash drawer without a sale (slip printed)');save();printHTML('<div style="text-align:center"><b>'+esc(S().name)+'</b><br>Drawer opened<br>'+fdate(nowISO())+'<br>by '+esc(cu.name)+'</div>');return}
  const r=await drawerKick();
  if(r.ok){log('drawer','Opened the cash drawer without a sale');save();toast('Drawer opened')}else toast('Drawer did not open. '+r.why);
}
/* Automatic open after a sale. */
async function drawerAuto(sale){
  const c=drawerCfg();if(c.mode!=='serial'&&c.mode!=='usb')return;
  const cash=(sale.payments||[]).some(p=>p.type==='cash'&&p.amt>0);
  if(c.when==='manual'||(c.when==='cash'&&!cash))return;
  const r=await drawerKick();if(!r.ok)toast('The cash drawer did not open. '+r.why);
}

/* ---------- session safety ----------
   1. A sign in lasts only while this tab or app stays open. sessionStorage is wiped when the tab or app
      is closed or the device is switched off. A "heartbeat" also covers browsers that restore old tabs:
      if the tab was last alive more than a minute ago, the next open asks for a password again.
   2. "Sign out other windows" and an admin's "Sign out this user" leave a small note in localStorage that
      every open window on this browser checks. */
const SO_KEY='anabros-signout',ALIVE_MS=60000;
const TAB_ID=ses.get('jb-tab')||(()=>{const t=Math.random().toString(36).slice(2);ses.set('jb-tab',t);return t})();
function soRead(){try{return JSON.parse(store.get(SO_KEY)||'{}')||{}}catch(e){return {}}}
function signOutOthers(userId){
  const o=soRead(),sig={t:Date.now(),except:TAB_ID};
  if(userId){o.users=o.users||{};o.users[userId]=sig}else o.all=sig;
  store.set(SO_KEY,JSON.stringify(o));
}
function sessionOK(u){
  if(!u||u.active===false)return false;
  if(Date.now()-(+ses.get('jb-alive')||0)>ALIVE_MS)return false;
  return !signedOutByNote(u.id);
}
function signedOutByNote(userId){
  const o=soRead(),at=+ses.get('jb-login-at')||0;
  const hit=s=>s&&s.t>at&&s.except!==TAB_ID;
  return hit(o.all)||hit((o.users||{})[userId]);
}
/* record of which windows are signed in, so a window that is closed (or a device switched off) without signing out is
   written into the activity log later, dated at the last moment it was alive */
/* working hours: one "shift" record per sign in. The end time and the minutes of real use (touching, typing) are
   kept up to date while the app is open, so hours stay right even when the connection drops or the device is switched off */
let lastInput=Date.now(),shAct=+ses.get('jb-act')||0,shBeats=0;
['pointerdown','keydown','touchstart','wheel'].forEach(ev=>window.addEventListener(ev,()=>{lastInput=Date.now()},{passive:true,capture:true}));
function shiftGet(){const id=ses.get('jb-shift');return id&&db&&db.shifts?db.shifts.find(s=>s.id===id):null}
function shiftStart(u){
  const s=shiftGet();if(s&&s.open&&s.userId===u.id)return;
  shAct=0;ses.set('jb-act','0');
  const n={id:uid(),userId:u.id,userName:u.name,start:new Date(+ses.get('jb-login-at')||Date.now()).toISOString(),end:nowISO(),actS:0,open:true,how:'',locId:curLoc};
  db.shifts.unshift(n);ses.set('jb-shift',n.id);save();
}
function shiftFlush(final,how){const s=shiftGet();if(!s)return;s.end=nowISO();s.actS=Math.round(shAct/1000);if(final){s.open=false;s.how=how||'Signed out'}}
const AL_KEY='anabros-alive';
function aliveRead(){try{return JSON.parse(store.get(AL_KEY)||'{}')||{}}catch(e){return {}}}
function aliveMark(){if(!cu)return;const o=aliveRead();o[TAB_ID]={u:cu.id,n:cu.name,at:Date.now(),sh:ses.get('jb-shift')||'',act:shAct};store.set(AL_KEY,JSON.stringify(o))}
function aliveClear(){const o=aliveRead();if(o[TAB_ID]){delete o[TAB_ID];store.set(AL_KEY,JSON.stringify(o))}}
function aliveSweep(){
  if(!db)return;const o=aliveRead();let n=0;
  for(const [t,s] of Object.entries(o)){
    if(Date.now()-s.at<=150000)continue;
    db.audit.unshift({id:uid(),date:new Date(s.at).toISOString(),userId:s.u,userName:s.n,action:'logout',detail:'Closed without signing out (the app was closed or the device was switched off)',locId:''});
    const sh=s.sh&&(db.shifts||[]).find(x=>x.id===s.sh);if(sh&&sh.open){sh.end=new Date(s.at).toISOString();sh.actS=Math.round((s.act||0)/1000);sh.open=false;sh.how='Closed without signing out'}
    delete o[t];n++;
  }
  if(n){store.set(AL_KEY,JSON.stringify(o));save();if(!cu)cloudWho('').catch(()=>{})}
}
function beat(){
  aliveSweep();
  if(!cu)return;
  if(signedOutByNote(cu.id)){logout('You were signed out from another window.','Signed out from another window');return}
  ses.set('jb-alive',String(Date.now()));
  if(Date.now()-lastInput<120000){shAct+=5000;ses.set('jb-act',String(shAct))}
  aliveMark();
  if(++shBeats%60===0){shiftFlush(false);save()}
  /* tell the server who is here, now and then, so the online list is right even after a missed message or a reconnect */
  if(shBeats%6===0)cloudWho(cu.name).catch(()=>{});
}
setInterval(beat,5000);

  const u=unitOf(it,unitName);const f=u?u.factor:1;

  if(pr)return r2(pr.price*f);

function fixLots(){

  for(let i=R.cart.length-1;i>=0;i--){const l=R.cart[i];
    if(l.lotId&&db.lots.find(x=>x.id===l.lotId&&x.locId===curLoc&&(x.qty>0.00001||canOver())))continue;

  if(!cands.length){
    if(!canOver()){toast('"'+it.name+'" is out of stock at '+locName(curLoc)+'. Only an admin, or someone with permission, can sell it.');return}

    if(lotLeft(lot,idx)+1e-9>=need){

      renderLines();jumpTop();updateTotals();return}
  }
  if(canOver()){const lot=cands[0];const idx=R.cart.findIndex(x=>x.id===id&&x.lotId===lot.id);if(idx>=0){R.cart[idx].qty++;R.cart.push(R.cart.splice(idx,1)[0])}else R.cart.push({id,qty:1,unit:'',factor:1,price:unitPrice(it,lot,''),disc:0,dtype:'pct',lotId:lot.id});renderLines();jumpTop();updateTotals();toast('More than is in stock. Allowed for your account.');return}

function onPayClick(e){

function sellProblem(){
  const ret=R.mode==='return';
  if(!R.cart.length)return'The cart is empty';
  const c=calc();
  if(c.total<=0)return'The total must be above zero';
  if(c.rem>0.004&&!R.customerId)return ret?'Refund the full amount, or choose a customer to credit their account.':'Take full payment, or choose a customer to put the balance on their account.';
  if(!ret){const used={};
    for(const l of R.cart){const it=itemById(l.id);const nm=it?it.name:'Item';const lot=lotOf(l);
      if(!lot||lot.locId!==curLoc||(lot.qty<=0.00001&&!canOver()))return`"${nm}" has no stock left in the chosen batch at ${locName(curLoc)}.`;
      if(!expOK()&&lotState(lot)==='expired')return`"${nm}", batch ${lot.batchNo||'(no number)'} has expired. Only an admin, or someone with permission, can sell expired goods.`;
      used[lot.id]=(used[lot.id]||0)+l.qty*l.factor;
      if(used[lot.id]>lot.qty+1e-6&&!canOver())return`Not enough "${nm}" in batch ${lot.batchNo||'(no number)'}. Only ${qf(lot.qty)} left.`}}
  return'';
}

function finalizeSale(){
  const ret=R.mode==='return';
  const prob=sellProblem();if(prob){toast(prob);return}
  const c=calc();const sg=ret?-1:1;
  const cust=custById(R.customerId);const L=S().loyalty;
  const pays=R.pays.map(p=>({...p}));let ch=c.change;
  for(let i=pays.length-1;i>=0&&ch>0.0049;i--){if(pays[i].type==='cash'){const d=Math.min(pays[i].amt,ch);pays[i].amt=r2(pays[i].amt-d);ch=r2(ch-d)}}
  const n=db.seq.sale++;
  const lines=R.cart.map((l,i)=>{
    const it=itemById(l.id)||{name:'Item',sku:'',category:'',cost:0};const base=r4(l.qty*l.factor);let allocs,costTotal,ovr=0;
    if(ret){const lot=addLot({itemId:l.id,locId:curLoc,batchNo:'RETURN',expiry:'',qty:base,cost:it.cost});allocs=[{lotId:lot.id,batchNo:'RETURN',expiry:'',qty:base,cost:it.cost}];costTotal=r2(it.cost*base)}
    else{const lot=lotOf(l);ovr=Math.max(0,r4(base-Math.max(lot.qty,0)));allocs=[{lotId:lot.id,batchNo:lot.batchNo,expiry:lot.expiry,qty:base,cost:lot.cost,over:ovr}];commitTake(allocs);if(ovr>0)log('oversell',`Sold ${qf(ovr)} more ${it.name} than was in stock (batch ${lot.batchNo||'-'})`);costTotal=r2(lot.cost*base)}
    const g=lineGross(l),d=lineDiscAmt(l);
    return{itemId:l.id,name:it.name,sku:it.sku,category:it.category,qty:base,price:r4(l.price/l.factor),unit:l.unit||'',unitQty:l.qty,unitPrice:l.price,
      discAmt:d,disc:g>0?r2(d/g*100):0,discType:l.dtype==='amt'?'amt':'pct',net:r2(g-d),costTotal,allocs,
      batches:ret?'':allocs.map(a=>a.batchNo+(a.expiry?' (exp '+a.expiry+')':'')).join(', ')}});
  const earned=(!ret&&L.on&&cust)?Math.floor(c.total/Math.max(1,L.perAmount)):0;
  const cdv=can('discount')?(R.cdisc||0):0;
  const sale={id:uid(),no:(ret?'RT-':'S-')+devTag()+String(n).padStart(5,'0'),date:nowISO(),type:ret?'return':'sale',locId:curLoc,userId:cu.id,userName:cu.name,cashier:cu.name,
    customerId:cust?cust.id:'',customerName:cust?cust.name:'',lines,
    subtotal:r2(c.sub*sg),discType:R.cdtype==='amt'?'amt':'pct',discPct:R.cdtype==='amt'?0:cdv,discAmt:r2(c.discAmt*sg),taxes:c.taxes.map(t=>({name:t.name,rate:t.rate,inclusive:t.inclusive,amt:r2(t.amt*sg)})),tax:r2(c.tax*sg),total:r2(c.total*sg),
    payments:pays.filter(p=>p.amt>0).map(p=>({type:p.type,amt:r2(p.amt*sg),ref:p.ref,code:p.code,points:p.points})),tendered:c.paid,change:c.change,owed:r2(c.rem*sg),owedBefore:c.owedBefore,debtPaid:c.debtPay,owedAfter:c.owedAfter,pointsEarned:earned,voided:false};
  sale.payments.forEach(p=>{
    if(p.type==='giftcard'){const g=db.giftCards.find(x=>x.id===p.ref);if(g){g.balance=r2(g.balance-p.amt);g.history.push({date:sale.date,delta:-p.amt,note:'Sale '+sale.no})}}
    if(p.type==='points'&&cust){cust.points=r4(cust.points-p.points);cust.pointsLog.push({date:sale.date,delta:-p.points,note:'Used on '+sale.no})}});
  if(cust){
    if(sale.owed)cust.owed=r2(cust.owed+sale.owed);
    if(c.debtPay>0){cust.owed=r2(cust.owed-c.debtPay);const lg={id:uid(),date:sale.date,kind:'customer',partyId:cust.id,partyName:cust.name,amt:c.debtPay,method:(pays.find(p=>p.amt>0)||{type:'cash'}).type,userId:cu.id,userName:cu.name,locId:curLoc,saleId:sale.id,note:'Paid with sale '+sale.no};db.ledger.push(lg);sale.ledgerId=lg.id}
    if(earned){cust.points=r4(cust.points+earned);cust.pointsLog.push({date:sale.date,delta:earned,note:'Earned on '+sale.no})}
    if(ret&&L.on){const back=Math.floor(c.total/Math.max(1,L.perAmount));if(back){cust.points=Math.max(0,r4(cust.points-back));cust.pointsLog.push({date:sale.date,delta:-back,note:'Taken back on '+sale.no})}}
  }
  db.sales.unshift(sale);
  log(ret?'return':'sale',`${sale.no} · ${money(sale.total)} · ${lines.map(l=>qtyText(l)+' '+l.name).join(', ')} at ${locName(curLoc)}${cust?' · '+cust.name:''}${sale.payments.length?' · '+[...new Set(sale.payments.map(p=>PAYNAMES[p.type]))].join(', '):''}${sale.debtPaid?' · '+money(sale.debtPaid)+' paid toward old balance':''}`,{amount:sale.total,ref:sale.id});
  save();
  if(cust&&cust.email&&S().email.auto)queueEmail({to:cust.email,toName:cust.name,subject:`Your receipt ${sale.no} from ${S().name}`,body:receiptText(sale),kind:'receipt'});

/* ---------- receipts and printing ---------- */
function receiptText(s){
  const W=34,st=S();const line=(l,r)=>{const sp=Math.max(1,W-l.length-r.length);return l+' '.repeat(sp)+r};
  const ctr=t=>' '.repeat(Math.max(0,Math.floor((W-t.length)/2)))+t;
  const o=[];o.push(ctr(st.name||''));if(st.address)o.push(ctr(st.address));if(st.phone)o.push(ctr('Tel: '+st.phone));
  o.push(ctr(locName(s.locId)));
  o.push('-'.repeat(W));o.push((s.type==='return'?'RETURN ':'RECEIPT ')+s.no);o.push(fdate(s.date));o.push('Served by: '+(s.userName||s.cashier||''));
  o.push('Customer: '+(s.customerName||'Walk-in'));if(s.voided)o.push('*** VOIDED ***');o.push('-'.repeat(W));
  s.lines.forEach(l=>{o.push(l.name);
    const dtxt=l.discAmt?' (-'+money(l.discAmt)+')':(l.disc?' (-'+qf(l.disc)+'%)':'');
    o.push(line('  '+qtyText(l)+' x '+money(l.unitPrice!=null?l.unitPrice:l.price)+dtxt,money(l.net)))});
  o.push('-'.repeat(W));o.push(line('Subtotal',money(s.subtotal)));
  if(s.discAmt)o.push(line('Discount'+(s.discType!=='amt'&&s.discPct?' '+qf(s.discPct)+'%':''),'-'+money(Math.abs(s.discAmt))));
  (s.taxes||[]).forEach(t=>o.push(line(t.name+' '+t.rate+'%'+(t.inclusive?' (incl.)':''),money(t.amt))));
  o.push(line(s.type==='return'?'REFUND TOTAL':'TOTAL',money(s.total)));o.push('');
  s.payments.forEach(p=>o.push(line((PAYNAMES[p.type]||p.type)+(p.code?' '+p.code:''),money(p.amt))));
  if(s.change>0)o.push(line('Cash tendered',money(s.tendered))),o.push(line('Change',money(s.change)));
  if(s.owed)o.push(line(s.type==='return'?'Credited to account':'Balance on account',money(Math.abs(s.owed))));
  if(s.type==='sale'&&s.customerId&&(s.owedBefore>0||s.owedAfter>0)){o.push(line('Owed before this sale',money(s.owedBefore||0)));if(s.debtPaid)o.push(line('Paid toward old balance','-'+money(s.debtPaid)));o.push(line('BALANCE OWED NOW',money(s.owedAfter||0)))}
  if(s.pointsEarned)o.push(line('Points earned',String(s.pointsEarned)));
  o.push('-'.repeat(W));if(st.footer)o.push(ctr(st.footer));
  return o.join('\n');
}

    const rv=$('#rv',m);if(rv)rv.onclick=()=>confirmBox('Void '+s.no+'? Stock, points, gift card balances and customer balance are put back as they were.',()=>{voidSale(s);toast(s.no+' voided');if(cur==='sales')vSales();if(cur==='register')renderTiles()},'Void sale');

function voidSale(s){
  if(s.voided||!guard('void'))return;const sg=sgn(s);
  s.lines.forEach(l=>{
    if(l.allocs&&l.allocs.length){l.allocs.forEach(a=>{
      if(sg>0)restoreAlloc(a,l.itemId,s.locId);
      else{const lot=db.lots.find(x=>x.id===a.lotId);if(lot)lot.qty=Math.max(0,r4(lot.qty-a.qty))}})}
    else addLot({itemId:l.itemId,locId:s.locId,batchNo:'RETURN',expiry:'',qty:sg>0?l.qty:0,cost:l.cost||0})});
  const c=custById(s.customerId);
  if(c){
    if(s.owed)c.owed=r2(c.owed-s.owed);
    if(s.debtPaid)c.owed=r2(c.owed+s.debtPaid);
    s.payments.forEach(p=>{if(p.type==='points'&&p.points){c.points=r4(c.points+p.points);c.pointsLog.push({date:nowISO(),delta:p.points,note:'Restored, '+s.no+' voided'})}});
    if(s.pointsEarned){c.points=Math.max(0,r4(c.points-s.pointsEarned));c.pointsLog.push({date:nowISO(),delta:-s.pointsEarned,note:'Removed, '+s.no+' voided'})}}
  s.payments.forEach(p=>{if(p.type==='giftcard'){const g=db.giftCards.find(x=>x.id===p.ref);if(g){g.balance=r2(g.balance+p.amt);g.history.push({date:nowISO(),delta:p.amt,note:'Restored, '+s.no+' voided'})}}});
  db.ledger=db.ledger.filter(x=>x.saleId!==s.id);
  s.voided=true;s.voidedAt=nowISO();s.voidedBy=cu.name;
  log('void',`${s.no} · ${money(s.total)} voided`,{amount:-s.total,ref:s.id});save();
}

function itemPerf(itemId,from,to){
  let qty=0,rev=0,cost=0,n=0,retQ=0;const pairs=[],byLoc={},byCust={},byUser={};
  db.sales.forEach(s=>{if(s.voided)return;const k=dkey(s.date);if(k<from||k>to)return;const g=sgn(s);
    s.lines.forEach(l=>{if(l.itemId!==itemId)return;qty+=l.qty*g;rev+=l.net*g;cost+=lineCost(l)*g;if(g>0)n++;else retQ+=l.qty;pairs.push([k,l.qty*g]);
      byLoc[s.locId]=(byLoc[s.locId]||0)+l.qty*g;const c=s.customerName||'Walk-in';byCust[c]=(byCust[c]||0)+l.qty*g;const u=s.userName||'-';byUser[u]=(byUser[u]||0)+l.qty*g})});
  return{qty,rev:r2(rev),cost:r2(cost),profit:r2(rev-cost),n,retQ,pairs,byLoc,byCust,byUser};
}
function perfBlock(itemId,showPick){
  const [from,to]=periodRange(ID.preset,ID.from,ID.to);const p=itemPerf(itemId,from,to);
  const data=seriesBuckets(from,to,p.pairs);const it=itemById(itemId);
  const top=o=>Object.entries(o).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const list=(o,f)=>top(o).length?`<table><tbody>${top(o).map(([k,v])=>`<tr><td>${esc(f?f(k):k)}</td><td class="num">${qf(v)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No sales in this period.</div>';
  const margin=p.rev>0?Math.round(p.profit/p.rev*100):0;
  const st=(k,v)=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="panel"><div class="filters">${showPick||''}${periodSelect('idp',ID.preset)}<span id="idc" class="${ID.preset==='custom'?'':'hide'}" style="display:flex;gap:8px"><input id="idf" type="date" value="${ID.from}" aria-label="From"><input id="idt" type="date" value="${ID.to}" aria-label="To"></span><span class="muted sm">${from===to?from:from+' to '+to}</span></div>
  <div class="stats">${st('Units sold',qf(p.qty))}${st('Revenue',money(p.rev))}${st('Gross profit',money(p.profit))}${st('Margin',margin+'%')}${st('Sales',p.n)}${st('Units returned',qf(p.retQ))}${st('In stock now',qf(stockAll(itemId)))}</div>
  <div class="pad">${p.pairs.length?barChart(data,v=>qf(v)+' units'):'<div class="empty">No sales of this item in this period.</div>'}</div></div>
  <div class="two"><section class="panel"><div class="ph"><h3>Top locations</h3></div>${list(p.byLoc,locName)}</section>
  <section class="panel"><div class="ph"><h3>Top customers</h3></div>${list(p.byCust)}</section>
  <section class="panel"><div class="ph"><h3>Sold by</h3></div>${list(p.byUser)}</section>
  <section class="panel"><div class="ph"><h3>Supplied by</h3></div>${supplierList(itemId)}</section></div>`;
}
function supplierList(itemId){
  const m={};db.receivings.forEach(r=>r.lines.forEach(l=>{if(l.itemId!==itemId)return;const k=r.supplierName||'No supplier';const o=m[k]||(m[k]={q:0,last:r.date,c:l.cost});o.q+=l.qty;if(r.date>o.last){o.last=r.date;o.c=l.cost}}));
  const e=Object.entries(m);
  return e.length?`<table><tbody>${e.map(([k,o])=>`<tr><td>${esc(k)}<span class="sub">Last: ${fday(dkey(o.last))} at ${money(o.c)}</span></td><td class="num">${qf(o.q)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Never received.</div>';
}

  <tfoot><tr><td colspan="5">${list.length} batch${list.length===1?'':'es'}</td><td class="num">${qf(list.reduce((a,l)=>a+l.qty,0))}</td><td class="num">${money(r2(list.reduce((a,l)=>a+l.qty*l.cost,0)))}</td><td></td><td></td></tr></tfoot></table>${loss?`<div class="pad sm muted">Expired stock at cost: <b class="mono bad-t">${money(loss)}</b>. Expired batches cannot be sold${S().allowExpiredSales?' (currently allowed in Settings)':''}. Use Remove on the batch to take them out of stock and record why.</div>`:''}`;
  box.onclick=e=>{const b=e.target.closest('[data-lot]');if(b){batchForm(b.dataset.lot);return}const r=e.target.closest('[data-rl]');if(r){const l=db.lots.find(x=>x.id===r.dataset.rl);removeStockForm(l.itemId,l.id);return}const o=e.target.closest('[data-lotd]');if(o)lotDetail(o.dataset.lotd)};

const rvUnitName=(l,it)=>l.unit||(it&&it.unit)||'piece';
function vReceivings(){app.onclick=null;

    <div class="pad stack">
      <div class="grid2"><label class="f">Into location<select id="rl2">${locs.map(l=>`<option value="${l.id}"${l.id===RV.locId?' selected':''}>${esc(l.name)}</option>`).join('')}</select></label>

    rq.value='';rr.classList.add('hide');RV.paid=null;rcvLines();rcvForm();
    const first=$('#rl .rline input');if(first){first.focus();first.select()}};
  rq.oninput=()=>{const q=rq.value.trim().toLowerCase();if(!q){rr.classList.add('hide');return}

const rvTotal=()=>r2(RV.lines.reduce((a,l)=>a+l.qty*l.cost,0));
function rcvLines(){
  const box=$('#rl');
  if(!RV.lines.length){box.innerHTML='<div class="empty">Search for the items you received. The item you add last appears at the top.</div>';return}
  box.innerHTML=RV.lines.map((l,i)=>{const it=itemById(l.itemId);const us=unitsOfItem(it);const un=rvUnitName(l,it);
    return `<div class="rline" data-i="${i}"><div class="rl1"><b>${esc(it?it.name:'Item')}</b><span><span class="muted sm">${qf(qtyAt(l.itemId,RV.locId))} ${esc(it&&it.unit||'piece')} in stock here</span> <button class="x" type="button" data-rm="${i}" aria-label="Remove">&times;</button></span></div>
    <div class="rgrid">
      <label class="f">Quantity<input type="number" inputmode="decimal" min="0" step="any" value="${l.qty}" data-f="qty"></label>
      <label class="f">Unit${us.length?`<select data-f="unit"><option value=""${!l.unit?' selected':''}>${esc(it.unit||'piece')}</option>${us.map(u=>`<option value="${esc(u.name)}"${l.unit===u.name?' selected':''}>${esc(u.name)} (${qf(u.factor)})</option>`).join('')}</select>`:`<input value="${esc(un)}" disabled>`}</label>
      <label class="f">Unit price (per ${esc(un)})<input type="number" inputmode="decimal" min="0" step="any" value="${l.cost}" data-f="cost"></label>
      <label class="f">Batch number<input value="${esc(l.batchNo)}" data-f="batchNo" placeholder="Optional"></label>
      <label class="f">Expiry date<input type="date" value="${l.expiry}" data-f="expiry"></label>
      <label class="f">Selling price of this batch (per ${esc(un)}, optional)<input type="number" inputmode="decimal" min="0" step="any" value="${l.price}" data-f="price" placeholder="Same as item"></label>
      <div class="f">Line total<div class="tv" id="rl-${i}">${money(l.qty*l.cost)}</div></div>
    </div></div>`}).join('');
  box.oninput=e=>{const f=e.target.dataset.f;if(!f||f==='unit')return;const i=+e.target.closest('.rline').dataset.i;const l=RV.lines[i];
    if(f==='batchNo'||f==='expiry')l[f]=e.target.value;
    else{l[f]=e.target.value===''&&f==='price'?'':Math.max(0,num(e.target.value));if(f==='qty'||f==='cost'){const el=$('#rl-'+i);el.textContent=money(l.qty*l.cost);RV.paid=null;const t=$('#rv-t');if(t)t.textContent=money(rvTotal());const pa=$('#rpaid');if(pa)pa.value=rvTotal()}}};
  box.onchange=e=>{if(e.target.dataset.f!=='unit')return;const i=+e.target.closest('.rline').dataset.i;const l=RV.lines[i];const it=itemById(l.itemId);
    const u=unitsOfItem(it).find(x=>x.name===e.target.value);l.unit=e.target.value;l.factor=u?u.factor:1;l.cost=r2((it?it.cost:0)*l.factor);RV.paid=null;rcvLines();rcvForm()};

function rcvForm(){
  const t=rvTotal();
  $('#rf').innerHTML=`<div class="grid3"><label class="f">Paid now<input id="rpaid" type="number" inputmode="decimal" min="0" step="any" value="${RV.paid==null?t:RV.paid}"></label>
  <label class="f">Method<select id="rm">${['cash','transfer','card'].map(k=>`<option value="${k}"${RV.method===k?' selected':''}>${PAYNAMES[k]}</option>`).join('')}</select></label>
  <label class="f">Note<input id="rn" value="${esc(RV.note)}" placeholder="Invoice no."></label></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>Total <b class="mono" id="rv-t">${money(t)}</b></span><button class="btn primary" id="rok" type="button">Receive goods</button></div>
  <div class="sm muted">Any unpaid amount is added to what you owe the supplier. You will be asked to confirm before anything is added to stock.</div>`;
  $('#rpaid').oninput=e=>{RV.paid=num(e.target.value)};$('#rm').onchange=e=>{RV.method=e.target.value};$('#rn').oninput=e=>{RV.note=e.target.value};
  $('#rok').onclick=confirmReceive;

function receiveProblem(){
  if(!can('receive'))return'Your account is not allowed to receive goods.';
  const lines=RV.lines.filter(l=>l.qty>0);if(!lines.length)return'Add the items you received';
  if(!RV.locId)return'Choose a location';
  const total=rvTotal();const paid=Math.min(total,r2(RV.paid==null?total:RV.paid));
  if(total-paid>0.004&&!suppById(RV.supplierId))return'Choose a supplier to record an unpaid balance';
  return'';
}
function confirmReceive(){
  const p=receiveProblem();if(p){toast(p);return}
  const lines=RV.lines.filter(l=>l.qty>0);const total=rvTotal();const paid=Math.min(total,r2(RV.paid==null?total:RV.paid));const sup=suppById(RV.supplierId);
  openModal(`<h2>Is this everything you want to receive?</h2>
  <div class="muted">Into ${esc(locName(RV.locId))} · ${sup?'from '+esc(sup.name):'no supplier'}. Check the list. Once confirmed, the goods are added to stock.</div>
  <div class="scroll"><table><thead><tr><th>Item</th><th>Batch</th><th>Expiry</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Total</th></tr></thead><tbody>${lines.map(l=>{const it=itemById(l.itemId);const un=rvUnitName(l,it);return `<tr><td>${esc(it?it.name:'Item')}${l.price!==''?`<span class="sub">Batch selling price ${money(l.price)} per ${esc(un)}</span>`:''}</td><td>${esc(l.batchNo||'-')}</td><td>${l.expiry?fday(l.expiry):'-'}</td><td class="num">${qf(l.qty)} ${esc(un)}${l.factor>1?`<span class="sub">= ${qf(l.qty*l.factor)} ${esc(it.unit||'piece')}</span>`:''}</td><td class="num">${money(l.cost)}</td><td class="num">${money(l.qty*l.cost)}</td></tr>`}).join('')}</tbody>
  <tfoot><tr><td colspan="3">${lines.length} item line${lines.length===1?'':'s'}</td><td class="num">${qf(lines.reduce((a,l)=>a+l.qty,0))}</td><td></td><td class="num">${money(total)}</td></tr></tfoot></table></div>
  <div class="tot" style="border:1px solid var(--line);border-radius:var(--r)"><div class="r"><span class="muted">Paid now (${PAYNAMES[RV.method]})</span><span class="mono">${money(paid)}</span></div>${total-paid>0.004?`<div class="r"><span class="bad-t">Added to what you owe ${esc(sup?sup.name:'')}</span><span class="mono bad-t">${money(r2(total-paid))}</span></div>`:''}</div>
  <div class="mactions"><button class="btn" data-close type="button">Go back and add more</button><button class="btn primary" id="cf" type="button">Yes, receive these goods</button></div>`,m=>{
    $('#cf',m).focus();$('#cf',m).onclick=()=>{closeModal();doReceive()}},true);
}
function doReceive(){
  const p=receiveProblem();if(p){toast(p);return}
  const lines=RV.lines.filter(l=>l.qty>0);const total=rvTotal();const paid=Math.min(total,r2(RV.paid==null?total:RV.paid));const sup=suppById(RV.supplierId);
  const rec={id:uid(),no:'RCV-'+devTag()+String(db.seq.recv++).padStart(4,'0'),date:nowISO(),locId:RV.locId,userId:cu.id,userName:cu.name,supplierId:sup?sup.id:'',supplierName:sup?sup.name:'',
    lines:lines.map(l=>{const it=itemById(l.itemId);const f=l.factor||1;return{itemId:l.itemId,name:it?it.name:'Item',qty:r4(l.qty*f),unit:l.unit||'',unitQty:l.qty,unitCost:l.cost,cost:r4(l.cost/f),batchNo:(l.batchNo||'').trim(),expiry:l.expiry||'',price:l.price===''?'':r4(l.price/f)}}),total,paid,method:RV.method,note:RV.note};
  rec.lines.forEach(l=>{const it=itemById(l.itemId);if(it){addLot({itemId:l.itemId,locId:RV.locId,batchNo:l.batchNo,expiry:l.expiry,qty:l.qty,cost:l.cost,price:l.price});it.cost=l.cost}});
  if(sup)sup.owed=r2(sup.owed+total-paid);
  db.receivings.unshift(rec);
  log('receive',`${rec.no} · ${rec.lines.length} line(s) · ${money(total)} into ${locName(RV.locId)}${sup?' from '+sup.name:''}`,{amount:total,ref:rec.id});
  save();RV.lines=[];RV.paid=null;RV.note='';vReceivings();toast('Goods received');
}
function rcvHist(){
  const box=$('#rh');
  const ids=myLocs().map(l=>l.id);const list=db.receivings.filter(r=>ids.includes(r.locId));

/* before moving goods, get the latest from the server, so the same request is never moved twice from two devices */
async function trFresh(){
  if(!SY||!SY.on)return true;
  if(navigator.onLine===false){toast('Connect to the internet for this. It stops the same transfer being handled twice on two devices.');return false}
  for(let i=0;i<20&&syRun.busy;i++)await new Promise(r=>setTimeout(r,250));
  await syRun(false);
  if(SY.err){toast('Could not check with the server: '+SY.err);return false}
  return true;
}
/* the server lets only one device do each step of a transfer */
async function trClaim(key){
  if(!SY||!SY.on)return true;
  const cc=cloudGet();if(!cc||!cc.token)return false;
  try{const r=await cloudCall(cc.url,cc.token,'/api/claim',{method:'POST',json:{key}});const d=await r.json().catch(()=>({}));
    if(r.ok&&d.first)return true;
    toast(r.ok?'Another device just handled this transfer. Sync to see it.':'Could not check with the server.');return false}
  catch(e){toast('Could not reach the server.');return false}
}
function pendingReceipts(){
  if(!cu)return[];
  const ml=myLocs().map(l=>l.id);
  return db.transfers.filter(t=>t.status==='sent'&&ml.includes(t.toLocId)&&(isAdmin()||can('receive')||can('transfers_request')));
}
async function approveTransfer(id){
  if(!await trFresh())return;
  const t=db.transfers.find(x=>x.id===id);if(!t||t.status!=='requested'){toast('That request was already answered.');if(cur==='transfers')vTransfers();return}
  if(!guard('transfers_approve')||!(isAdmin()||(cu.locationIds||[]).includes(t.fromLocId))){toast('Only someone at '+locName(t.fromLocId)+' can approve this.');return}
  for(const l of t.lines){if(qtyAt(l.itemId,t.fromLocId)+0.00001<l.qty){toast('Not enough '+itemName(l.itemId)+' at '+locName(t.fromLocId)+' to approve this.');return}}
  if(!await trClaim(t.id+':a'))return;
  if(t.status!=='requested')return;
  t.moved=[];
  t.lines.forEach(l=>{const p=planTake(l.itemId,t.fromLocId,l.qty,true);commitTake(p.allocs);
    p.allocs.forEach(a=>{t.moved.push({itemId:l.itemId,batchNo:a.batchNo,expiry:a.expiry,qty:a.qty,cost:a.cost,price:a.price})})});
  t.status='sent';t.decidedById=cu.id;t.decidedByName=cu.name;t.decidedAt=nowISO();
  log('transfer_approve',`${t.no} sent · ${locName(t.fromLocId)} to ${locName(t.toLocId)} · ${t.lines.map(l=>itemName(l.itemId)+' x '+qf(l.qty)).join(', ')}`,{ref:t.id});
  save();vTransfers();toast('Goods are on the way to '+locName(t.toLocId));
}
async function receiveTransfer(id){
  if(!await trFresh())return;
  const t=db.transfers.find(x=>x.id===id);if(!t||t.status!=='sent'){toast('This transfer was already received.');if(cur==='transfers')vTransfers();return}
  if(!(isAdmin()||((cu.locationIds||[]).includes(t.toLocId)&&(can('receive')||can('transfers_request'))))){toast('Only someone at '+locName(t.toLocId)+' can confirm this.');return}
  const sent={};t.moved.forEach(a=>sent[a.itemId]=(sent[a.itemId]||0)+a.qty);
  openModal(`<h2>Goods received at ${esc(locName(t.toLocId))}</h2><p class="muted">${esc(t.no)} from ${esc(locName(t.fromLocId))}. Check what actually arrived. Anything less than was sent is recorded as missing.</p>
  <form id="f" class="stack"><table><thead><tr><th>Item</th><th class="num">Sent</th><th style="width:110px">Arrived</th></tr></thead><tbody>${Object.keys(sent).map(k=>`<tr><td>${esc(itemName(k))}</td><td class="num">${qf(sent[k])}</td><td><input type="number" min="0" max="${sent[k]}" step="any" value="${sent[k]}" data-k="${k}" aria-label="Arrived"></td></tr>`).join('')}</tbody></table>
  <div class="mactions"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" type="submit">Confirm received</button></div></form>`,m=>{
    $('#f',m).onsubmit=async e=>{e.preventDefault();
      const got={};for(const i of $$('input[data-k]',m)){const v=num(i.value);if(!(v>=0)||v>sent[i.dataset.k]+0.00001){toast('Arrived cannot be more than was sent.');return}got[i.dataset.k]=v}
      if(!await trFresh())return;
      const t2=db.transfers.find(x=>x.id===id);if(!t2||t2.status!=='sent'){closeModal();toast('This transfer was already received.');if(cur==='transfers')vTransfers();return}
      if(!await trClaim(t2.id+':r'))return;
      if(t2.status!=='sent')return;
      const left={...got};t2.short=[];
      for(const a of t2.moved){const take=Math.min(left[a.itemId]||0,a.qty);if(take>0){addLot({itemId:a.itemId,locId:t2.toLocId,batchNo:a.batchNo,expiry:a.expiry,qty:take,cost:a.cost,price:a.price});left[a.itemId]-=take}}
      Object.keys(sent).forEach(k=>{const miss=Math.round((sent[k]-got[k])*1e4)/1e4;if(miss>0)t2.short.push({itemId:k,qty:miss})});
      t2.status='received';t2.receivedById=cu.id;t2.receivedByName=cu.name;t2.receivedAt=nowISO();
      log('transfer_receive',`${t2.no} received at ${locName(t2.toLocId)}${t2.short.length?' · missing '+t2.short.map(s=>itemName(s.itemId)+' x '+qf(s.qty)).join(', '):''}`,{ref:t2.id});
      save();closeModal();vTransfers();toast(t2.short.length?'Received. The missing goods were recorded.':'Goods added to '+locName(t2.toLocId))};
  });
}
async function declineTransfer(id){
  if(!await trFresh())return;
  const t=db.transfers.find(x=>x.id===id);if(!t||t.status!=='requested'){toast('That request was already answered.');if(cur==='transfers')vTransfers();return}
  if(!guard('transfers_approve')||!(isAdmin()||(cu.locationIds||[]).includes(t.fromLocId))){toast('Only someone at '+locName(t.fromLocId)+' can decline this.');return}

}

  const lines=[];list.forEach(s=>s.lines.forEach(l=>lines.push({Receipt:s.no,Date:fdate(s.date),Location:locName(s.locId),'Sold by':s.userName,Customer:s.customerName||'Walk-in',Item:l.name,Batch:l.batches||'',Qty:qtyText(l,sgn(s)),'Base qty':l.qty*sgn(s),Price:l.unitPrice!=null?l.unitPrice:l.price,Discount:l.discAmt||0,Total:r2(l.net*sgn(s)),Status:s.voided?'Voided':'OK'})));
  return{Sales:head,'Sale lines':lines};
}
function saleRows(){
  const list=filteredSales();const box=$('#stbl');
  if(!list.length){box.innerHTML='<div class="empty">'+(db.sales.length?'No sales match these filters.':'No sales yet. Complete a sale on the Register.')+'</div>';return}
  const sum=r2(list.filter(s=>!s.voided).reduce((a,s)=>a+s.total,0));
  const shown=list.slice(0,300);
  box.innerHTML=`<table><thead><tr><th style="width:34px"><input type="checkbox" id="sa" aria-label="Select all listed"${shown.length&&shown.every(s=>SEL.has(s.id))?' checked':''}></th><th>Receipt</th><th>Date</th><th>Location</th><th>Sold by</th><th>Customer</th><th class="num">Items</th><th>Paid by</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>${shown.map(s=>`<tr class="click" data-s="${s.id}"><td><input type="checkbox" data-sel="${s.id}" aria-label="Select ${esc(s.no)}"${SEL.has(s.id)?' checked':''}></td><td class="mono">${esc(s.no)}</td><td>${fdate(s.date)}</td><td>${esc(locName(s.locId))}</td><td>${esc(s.userName||'-')}</td><td>${esc(s.customerName||'Walk-in')}</td><td class="num">${qf(s.lines.length)} line${s.lines.length===1?'':'s'}</td><td>${[...new Set(s.payments.map(p=>PAYNAMES[p.type]))].join(', ')||'-'}</td><td class="num">${money(s.total)}</td>
  <td>${s.voided?'<span class="tag bad">Voided</span>':s.type==='return'?'<span class="tag warn">Return</span>':s.owed>0.004?'<span class="tag warn">Owes '+money(s.owed)+'</span>':'<span class="tag ok">Paid</span>'}</td><td><button class="btn small" data-pr="${s.id}" type="button">Print</button></td></tr>`).join('')}</tbody></table>
  <div class="pad sm muted" style="border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>${list.length} record${list.length===1?'':'s'}${list.length>300?' (showing 300)':''}</span><span>Net total, excluding voided: <b class="mono">${money(sum)}</b></span></div>`;
  const upd=()=>{const n=list.filter(s=>SEL.has(s.id)).length;$('#sn').textContent=n?n+' selected':'Tick sales to print them together';const a=$('#sa');if(a)a.checked=shown.length>0&&shown.every(s=>SEL.has(s.id))};upd();
  box.onclick=e=>{
    if(e.target.id==='sa'){shown.forEach(s=>e.target.checked?SEL.add(s.id):SEL.delete(s.id));$$('[data-sel]',box).forEach(c=>c.checked=e.target.checked);upd();return}
    const c=e.target.closest('[data-sel]');if(c){c.checked?SEL.add(c.dataset.sel):SEL.delete(c.dataset.sel);upd();return}
    const p=e.target.closest('[data-pr]');if(p){printHTML(printReceiptHTML(db.sales.find(x=>x.id===p.dataset.pr)));return}
    const tr=e.target.closest('[data-s]');if(tr)showReceipt(db.sales.find(x=>x.id===tr.dataset.s))};
}
